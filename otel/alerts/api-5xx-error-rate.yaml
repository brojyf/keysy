apiVersion: rules.alerting.grafana.app/v1beta1
kind: AlertRule
metadata:
  name: keysy-api-5xx-error-rate
  annotations:
    grafana.app/folder: keysy
spec:
  title: api 5xx error rate
  trigger:
    interval: 1m
  for: 1m
  noDataState: Ok
  execErrState: Error
  labels:
    severity: warning
    service: keysy-api
  annotations:
    summary: 5xx error rate
    description: '{{ humanizePercentage $values.A.Value }} of requests over 5m (threshold 1%)'
  notificationSettings:
    type: SimplifiedRouting
    receiver: discord
  expressions:
    A:
      datasourceUID: grafanacloud-prom
      relativeTimeRange:
        from: 10m
        to: "0"
      model:
        expr: |
          sum(rate(http_server_request_duration_seconds_count{job="keysy-api", http_response_status_code=~"5.."}[5m]))
          /
          sum(rate(http_server_request_duration_seconds_count{job="keysy-api"}[5m]))
        instant: true
    B:
      datasourceUID: __expr__
      source: true
      model:
        type: threshold
        expression: A
        conditions:
          - evaluator:
              type: gt
              params: [0.01]
