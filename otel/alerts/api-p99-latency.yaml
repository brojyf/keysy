apiVersion: rules.alerting.grafana.app/v1beta1
kind: AlertRule
metadata:
  name: keysy-api-p99-latency
  annotations:
    grafana.app/folder: keysy
spec:
  title: api p99 latency
  trigger:
    interval: 1m
  for: 5m
  noDataState: Ok
  execErrState: Error
  labels:
    severity: warning
    service: keysy-api
  annotations:
    summary: p99 latency
    description: '{{ humanizeDuration $values.A.Value }} over 5m (threshold 1s)'
  notificationSettings:
    type: SimplifiedRouting
    receiver: discord
  expressions:
    A:
      datasourceUID: grafanacloud-prom
      relativeTimeRange:
        from: 10m
        to: "0"
      model:
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="keysy-api", deployment_environment_name!="local"}[5m])))
        instant: true
    B:
      datasourceUID: __expr__
      source: true
      model:
        type: threshold
        expression: A
        conditions:
          - evaluator:
              type: gt
              params: [1]
