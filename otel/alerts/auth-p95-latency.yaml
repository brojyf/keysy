apiVersion: rules.alerting.grafana.app/v1beta1
kind: AlertRule
metadata:
  name: keysy-auth-p95-latency
  annotations:
    grafana.app/folder: keysy
spec:
  title: auth p95 latency
  trigger:
    interval: 1m
  for: 5m
  noDataState: Ok
  execErrState: Error
  labels:
    severity: warning
    service: keysy-auth
  annotations:
    summary: p95 latency
    description: '{{ humanizeDuration $values.A.Value }} over 5m (threshold 500ms)'
  notificationSettings:
    type: SimplifiedRouting
    receiver: discord
  expressions:
    A:
      datasourceUID: grafanacloud-prom
      relativeTimeRange:
        from: 10m
        to: "0"
      model:
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="keysy-auth"}[5m])))
        instant: true
    B:
      datasourceUID: __expr__
      source: true
      model:
        type: threshold
        expression: A
        conditions:
          - evaluator:
              type: gt
              params: [0.5]
