openapi: 3.0.3
info:
  title: Keysy API
  version: 0.0.0
  description: |
    The application API provides Keysy's app features: orgs and members, secrets and folder versions,
    access policies, services, AI reorganization, and audit logs.

    This is the v0 draft, not a stable release.

    This reference is generated from `openapi/api.yaml`, the source of truth for the application API.
tags:
  - name: Orgs
  - name: Members
  - name: Secrets
  - name: Folders
  - name: Policies
  - name: Services
  - name: Reorganizations
  - name: Audit logs
security:
  - bearerAuth: []
paths:
  /v0/me:
    get:
      tags: [Orgs]
      operationId: getMe
      summary: Get the signed-in user and their orgs
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Orgs]
      operationId: deleteAccount
      summary: Delete your account
      description: Reject with 409 while the account is Admin of any org. Transfer the Admin role or
        delete those orgs first. Otherwise remove memberships in all orgs and revoke all account sessions.
      responses:
        '204':
          description: Delete your account
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs:
    post:
      tags: [Orgs]
      operationId: createOrg
      summary: Create an org
      description: Any signed-in user can create an org and becomes its only Admin. Org creation and membership
        commit atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Org created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v0/orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members
      description: All members can view member names and roles. This response never includes another member's
        scope.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Members]
      operationId: addMember
      summary: Add a member by email
      description: Admin only. Add a Developer with no assigned policies or permission sets. The org appears
        after the member signs in with this email. Email is unique within the org.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/MemberId'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member
      description: Admin only, except a Developer can remove their own membership to leave the org. The
        Admin must transfer the role or delete the org before leaving; reject attempts to remove the Admin
        with 409. Access is removed on the next authorized request.
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/secrets:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Secrets]
      operationId: listSecrets
      summary: List secrets
      description: Returns metadata only. Users and services see only secrets they can read.
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
          example: production/api/
        - name: q
          in: query
          description: Search text matched against paths.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Secrets]
      operationId: createSecret
      summary: Create a secret
      description: Admin, or a Developer within their assigned scope. Services cannot write. Creates a
        new version of its folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
      responses:
        '201':
          description: Secret created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/secrets/{secretId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SecretId'
    get:
      tags: [Secrets]
      operationId: getSecret
      summary: Get secret metadata
      responses:
        '200':
          description: Secret metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Secrets]
      operationId: updateSecret
      summary: Update, move, or annotate a secret
      description: "Admin, or a Developer within their assigned scope. Services cannot write. Creates a\
        \ new version of its folder; a move\ncreates one in both the source and the destination folder.\
        \ Versions\nbeyond the retention limit N are permanently deleted.\n A move must keep both source\
        \ and destination folders within the caller's scope. Update only policies the caller can manage;\
        \ other services continue to follow their unchanged policy paths."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdate'
      responses:
        '200':
          description: Secret updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      summary: Delete a secret
      description: Admin, or a Developer within their assigned scope. Services cannot write. Creates a
        new version of its folder. Update only policies the caller can manage; other policies retain their
        paths.
      responses:
        '204':
          description: Secret deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/secrets/{secretId}/value:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SecretId'
    get:
      tags: [Secrets]
      operationId: getSecretValue
      summary: Retrieve a secret's current value
      description: Retrievals by a service update its retrieval record for the secret's folder.
      responses:
        '200':
          description: The current value.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/secret-values:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Secrets]
      operationId: listSecretValues
      summary: Retrieve current values under a path prefix
      description: |
        For the CLI and service runtime. Returns only readable secrets. The
        values from each folder come from one complete version of it.
        Retrievals by a service update its retrieval record for each folder.
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
          example: production/api/
      responses:
        '200':
          description: Current values.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretValue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v0/orgs/{orgId}/folder-versions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/FolderPath'
    get:
      tags: [Folders]
      operationId: listFolderVersions
      summary: List a folder's recent versions
      description: 'Admin, or a Developer within their assigned scope. Services cannot write. Returns the
        current version and up to N previous

        versions, with what changed in each and without values.

        '
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FolderVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/folder-rollbacks:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      tags: [Folders]
      operationId: rollBackFolder
      summary: Roll a folder back to a previous version
      description: 'Admin, or a Developer within their assigned scope. Services cannot write. Creates a
        new version with the selected

        version''s secrets; later versions are kept.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, version]
              properties:
                path:
                  $ref: '#/components/schemas/FolderPath'
                version:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Rollback version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/folder-retrievals:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/FolderPath'
    get:
      tags: [Folders]
      operationId: listFolderRetrievals
      summary: List each service's last retrieval
      description: Admin, or a Developer within their assigned scope. Services cannot write. One record
        per service, separate from audit logs.
      responses:
        '200':
          description: Last retrieval per service.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRetrieval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v0/orgs/{orgId}/policies:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: List policies
      description: All members see every policy name and its service. Return paths as null when the policy
        is outside the Developer's scope. Services cannot list policies.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v0/orgs/{orgId}/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PolicyId'
    patch:
      tags: [Policies]
      operationId: updatePolicy
      summary: Update a policy
      description: Admin, or a Developer when every policy path before and after the change is within their
        scope as it stood before the change. Never expand authority through this operation. A policy belongs
        to exactly one service; membership grants change only through the Admin scope endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdate'
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/services:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Services]
      operationId: listServices
      summary: List services
      description: Admin, or a Developer listing only services whose complete policy is within their scope.
        A policy directory exposes other service names without exposing policy paths.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Services]
      operationId: createService
      summary: Create a service
      description: Admin, or a Developer when every policy path before and after the change is within their
        scope as it stood before the change. Never expand authority through this operation. Create the
        service and its exactly one policy atomically. A policy cannot be created independently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '201':
          description: Service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
    delete:
      tags: [Services]
      operationId: deleteService
      summary: Delete a service and revoke its tokens
      description: Admin, or a Developer when every policy path before and after the change is within their
        scope as it stood before the change. Never expand authority through this operation. Delete its
        policy, remove that policy from member scopes and permission sets, close related access requests,
        and revoke all service tokens in the same transaction.
      responses:
        '204':
          description: Service deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Services]
      operationId: updateService
      summary: Rename a service
      description: Admin, or a Developer when every policy path before and after the change is within
        their scope as it stood before the change. Never expand authority through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Rename a service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/services/{serviceId}/tokens:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Services]
      operationId: listServiceTokens
      summary: List a service's tokens
      description: Admin, or a Developer when every policy path before and after the change is within their
        scope as it stood before the change. Never expand authority through this operation. Token values
        are never returned.
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Services]
      operationId: createServiceToken
      summary: Issue a service token
      description: Admin, or a Developer when every policy path before and after the change is within their
        scope as it stood before the change. Never expand authority through this operation. The token value
        is returned only once.
      responses:
        '201':
          description: Token issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ServiceToken'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/services/{serviceId}/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Services]
      operationId: revokeServiceToken
      summary: Revoke a service token
      description: Admin, or a Developer when every policy path before and after the change is within their
        scope as it stood before the change. Never expand authority through this operation.
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v0/orgs/{orgId}/reorganizations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      tags: [Reorganizations]
      operationId: proposeReorganization
      summary: Propose an AI reorganization
      description: Admin, or a Developer within their scope. The AI agent proposes moves and changes only
        to policies the caller can manage. Do not send secret values to the LLM. Nothing changes until
        the proposal is applied. accessDiff lists affected readable secret IDs only where the caller can
        view them; it must not reveal hidden paths or other members' scopes. Other services continue to
        follow their unchanged policy paths.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction:
                  type: string
                  example: Move the Stripe and Resend keys into production/shared.
      responses:
        '201':
          description: Proposal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reorganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v0/orgs/{orgId}/reorganizations/{reorganizationId}/apply:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: reorganizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Reorganizations]
      operationId: applyReorganization
      summary: Apply a proposed reorganization
      description: Recheck the caller's current scope before applying. Every source and destination folder
        and every managed policy path before and after the change must be within that scope. Apply all
        changes in one transaction and verify the authorized access diff. Each affected folder gets one
        new version. Return 409 and apply nothing if secrets or policies changed after proposal, or verification
        fails.
      responses:
        '200':
          description: Reorganization applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reorganization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v0/orgs/{orgId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Audit logs]
      operationId: listAuditLogs
      summary: List audit logs
      description: Admin sees all org records. Developers see only records for paths within their scope
        and policy records only if every recorded policy path is within that scope. Member, scope, permission-set
        and Admin role records are Admin-only. Record change attempts, including denied and failed ones,
        without secret values. Service retrievals update the latest folder retrieval record separately.
      parameters:
        - name: targetType
          in: query
          schema:
            $ref: '#/components/schemas/AuditTargetType'
        - name: targetId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of audit records, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v0/orgs/{orgId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Orgs]
      operationId: deleteOrg
      summary: Delete an org
      description: Admin only. Delete the org and its business data, memberships and service tokens.
        Audit retention is independent of folder history; the audit retention and account-erasure procedure
        remain to be finalized.
      responses:
        '204':
          description: Delete an org
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/admin-transfer:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Members]
      operationId: transferAdmin
      summary: Transfer the Admin role
      description: Admin only. Transfer to an existing signed-in member in one transaction and keep
        exactly one Admin. The previous Admin becomes a Developer with scope over every path. Support
        uses a verified recovery procedure if the Admin cannot be reached; that procedure is not a
        public endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties:
                memberId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Transfer the Admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/me/notification-preferences:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Members]
      operationId: getNotificationPreferences
      summary: Get your notification preferences
      description: Members read their own preferences in this org. On membership creation both email
        options default to on for the Admin and off for Developers. Reminder lead time is a positive
        number of days.
      responses:
        '200':
          description: Get your notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Members]
      operationId: updateNotificationPreferences
      summary: Update your notification preferences
      description: Members update only their own preferences. Email recipients must still have scope
        over the affected secrets at send time. Exclude the actor from secret update emails. Expiration
        reminders do not rotate, delete or invalidate secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdate'
      responses:
        '200':
          description: Update your notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/members/{memberId}/scope:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Members]
      operationId: getMemberScope
      summary: Get a member scope
      description: Admin or the member themselves. Other Developers cannot read this scope. Admin scope
        always covers every path.
      responses:
        '200':
          description: Get a member scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberScope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Members]
      operationId: updateMemberScope
      summary: Replace a Developer scope
      description: Admin only. Replace the Developer's policy and permission-set assignments and full-path
        marker atomically. All IDs must belong to this org. Revocation takes effect on the next request,
        including cached reads. The Admin's own full scope cannot be reduced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberScope'
      responses:
        '200':
          description: Replace a Developer scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberScope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/permission-sets:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Policies]
      operationId: listPermissionSets
      summary: List permission sets
      description: Admin only. Permission sets are reusable named groups of policies within this org.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List permission sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Policies]
      operationId: createPermissionSet
      summary: Create a permission set
      description: Admin only. All referenced policies must belong to this org.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionSetWrite'
      responses:
        '201':
          description: Create a permission set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/permission-sets/{permissionSetId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: permissionSetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Policies]
      operationId: updatePermissionSet
      summary: Replace a permission set
      description: Admin only. Update the name and policy IDs. The effective scope of assigned Developers
        changes on the next request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionSetWrite'
      responses:
        '200':
          description: Replace a permission set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Policies]
      operationId: deletePermissionSet
      summary: Delete a permission set
      description: Admin only. Remove its member assignments. Independently assigned policies and permission
        sets remain in effect.
      responses:
        '204':
          description: Delete a permission set
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/access-requests:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Policies]
      operationId: listAccessRequests
      summary: List policy access requests
      description: Admin sees all requests; Developers see only their own. Services cannot use this
        endpoint.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List policy access requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Policies]
      operationId: createAccessRequest
      summary: Request access to a policy
      description: A Developer requests an out-of-scope policy with an optional reason. Notify the
        Admin without exposing hidden policy paths. Reject a duplicate pending request with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyId]
              properties:
                policyId:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '201':
          description: Request access to a policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/access-requests/{requestId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Policies]
      operationId: reviewAccessRequest
      summary: Approve or decline an access request
      description: Admin only. Approval adds the policy to the Developer's direct scope in the same
        transaction. Decline changes no scope. Only a pending request can be reviewed; return 409 for
        a resolved request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, declined]
      responses:
        '200':
          description: Approve or decline an access request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Supabase JWT for users, or a service token for services.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderPath:
      name: path
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/FolderPath'
    SecretId:
      name: secretId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    NoStore:
      schema:
        type: string
        enum: [no-store]
  schemas:
    Role:
      type: string
      enum: [admin, developer]
    Me:
      type: object
      required: [id, email, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        memberships:
          type: array
          items:
            type: object
            required: [org, role]
            properties:
              org:
                $ref: '#/components/schemas/Org'
              role:
                $ref: '#/components/schemas/Role'
    Org:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Member:
      type: object
      required: [id, email, role, userId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        userId:
          type: string
          format: uuid
          nullable: true
          description: Null until the member signs in for the first time.
        createdAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          type: string
          nullable: true
    SecretPath:
      type: string
      description: Slash-separated path. The last segment is the secret name.
      example: production/api/DATABASE_URL
    Secret:
      type: object
      required: [id, path, note, expiresAt, folderVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        path:
          $ref: '#/components/schemas/SecretPath'
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional reminder date. A member receives reminders according to their own preferences
            and scope. Keysy does not rotate or invalidate the secret.
        folderVersion:
          type: integer
          minimum: 1
          description: The current version of the secret's folder.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SecretPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        nextCursor:
          type: string
          nullable: true
    SecretCreate:
      type: object
      required: [path, value]
      properties:
        path:
          $ref: '#/components/schemas/SecretPath'
        value:
          type: string
        note:
          type: string
        expiresAt:
          type: string
          format: date-time
    SecretUpdate:
      type: object
      minProperties: 1
      properties:
        path:
          $ref: '#/components/schemas/SecretPath'
        value:
          type: string
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    FolderPath:
      type: string
      description: A secret path without its last segment.
      example: production/shared
    FolderVersion:
      type: object
      required: [version, actorId, rollbackOf, changes, createdAt]
      properties:
        version:
          type: integer
          minimum: 1
        actorId:
          type: string
          format: uuid
          description: The user who made the change.
        rollbackOf:
          type: integer
          minimum: 1
          nullable: true
          description: The version this one restores, or null when it is not a rollback.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SecretChange'
        createdAt:
          type: string
          format: date-time
    SecretChange:
      type: object
      required: [secretId, name, change, fields]
      properties:
        secretId:
          type: string
          format: uuid
        name:
          type: string
          description: The secret's name in this folder after the change, or before it when it left the folder.
        change:
          type: string
          enum: [created, updated, deleted, moved_in, moved_out]
        fields:
          type: array
          description: The fields an `updated` change modified. Empty for other changes.
          items:
            type: string
            enum: [name, value, note, expiresAt]
    SecretValue:
      type: object
      required: [secretId, path, folderVersion, value]
      properties:
        secretId:
          type: string
          format: uuid
        path:
          $ref: '#/components/schemas/SecretPath'
        folderVersion:
          type: integer
          minimum: 1
          description: The folder version this value comes from.
        value:
          type: string
    ServiceRetrieval:
      type: object
      required: [serviceId, serviceName, version, retrievedAt]
      properties:
        serviceId:
          type: string
          format: uuid
        serviceName:
          type: string
        version:
          type: integer
          minimum: 1
          description: The folder version last retrieved.
        retrievedAt:
          type: string
          format: date-time
    Assignee:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [user, service]
        id:
          type: string
          format: uuid
          description: A member ID or a service ID.
    PathPattern:
      type: string
      description: An exact folder path, or a folder prefix ending in /*. Never a single secret path. The
        whole folder is within scope or outside it.
      example: production/api/*
    Policy:
      type: object
      required: [id, serviceId, name, paths, createdAt, updatedAt]
      description: Exactly one policy per service. Its paths grant runtime read access to that service
        and contribute to assigned Developer scopes.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        paths:
          type: array
          items:
            $ref: '#/components/schemas/PathPattern'
          nullable: true
          description: Null outside the Developer's scope. Otherwise folder path rules.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        serviceId:
          type: string
          format: uuid
    PolicyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        nextCursor:
          type: string
          nullable: true
    PolicyUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        paths:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PathPattern'
    Service:
      type: object
      required: [id, name, policyId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        policyId:
          type: string
          format: uuid
    ServicePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        nextCursor:
          type: string
          nullable: true
    ServiceToken:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    Reorganization:
      type: object
      required: [id, instruction, status, moves, policyChanges, accessDiff, createdAt]
      properties:
        id:
          type: string
          format: uuid
        instruction:
          type: string
        status:
          type: string
          enum: [proposed, applied]
        moves:
          type: array
          items:
            type: object
            required: [secretId, from, to]
            properties:
              secretId:
                type: string
                format: uuid
              from:
                $ref: '#/components/schemas/SecretPath'
              to:
                $ref: '#/components/schemas/SecretPath'
        policyChanges:
          type: array
          items:
            type: object
            required: [policyId, pathsBefore, pathsAfter]
            properties:
              policyId:
                type: string
                format: uuid
              pathsBefore:
                type: array
                items:
                  $ref: '#/components/schemas/PathPattern'
              pathsAfter:
                type: array
                items:
                  $ref: '#/components/schemas/PathPattern'
        accessDiff:
          type: array
          description: Authorized access changes only. Do not expose other members' scopes or hidden policy
            paths to Developers. Empty when no visible assignee changes readable secrets.
          items:
            type: object
            required: [assignee, gained, lost]
            properties:
              assignee:
                $ref: '#/components/schemas/Assignee'
              gained:
                type: array
                items:
                  type: string
                  format: uuid
                description: Secret IDs the assignee could newly read.
              lost:
                type: array
                items:
                  type: string
                  format: uuid
                description: Secret IDs the assignee could no longer read.
        createdAt:
          type: string
          format: date-time
    AuditTargetType:
      type: string
      enum: [secret, folder, policy, member, service, org, permission_set, access_request]
    AuditLog:
      type: object
      required: [id, actorId, action, targetType, targetId, outcome, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          description: The user who made the change.
        action:
          type: string
          example: folder.version_created
        targetType:
          $ref: '#/components/schemas/AuditTargetType'
        targetId:
          type: string
          format: uuid
          nullable: true
          description: Null when the attempt never created its target, such as a denied or failed create.
        outcome:
          type: string
          enum: [success, denied, failed]
          description: '`denied` when authorization rejects the change; `failed` when an authorized change does not commit.'
        occurredAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        nextCursor:
          type: string
          nullable: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: secret_path_conflict
            message:
              type: string
    NotificationPreferences:
      type: object
      required: [expirationReminders, secretUpdateEmails, reminderDays]
      properties:
        expirationReminders:
          type: boolean
        secretUpdateEmails:
          type: boolean
        reminderDays:
          type: integer
          minimum: 1
          description: Days before expiresAt. The initial lead time is not yet selected.
    NotificationPreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        expirationReminders:
          type: boolean
        secretUpdateEmails:
          type: boolean
        reminderDays:
          type: integer
          minimum: 1
          description: Days before expiresAt. The initial lead time is not yet selected.
    MemberScope:
      type: object
      required: [allPaths, policyIds, permissionSetIds]
      properties:
        allPaths:
          type: boolean
          description: Full path scope, including the scope retained by the previous Admin. Only the
            Admin can change this marker; it is not another role.
        policyIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        permissionSetIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    ServiceCreate:
      type: object
      required: [name, policy]
      properties:
        name:
          type: string
        policy:
          type: object
          required: [name, paths]
          properties:
            name:
              type: string
            paths:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PathPattern'
    PermissionSet:
      type: object
      required: [id, name, policyIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        policyIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    PermissionSetWrite:
      type: object
      required: [name, policyIds]
      properties:
        name:
          type: string
        policyIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    PermissionSetPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionSet'
        nextCursor:
          type: string
          nullable: true
    AccessRequest:
      type: object
      required: [id, memberId, policyId, reason, status, createdAt, reviewedBy, reviewedAt]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, declined]
        createdAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
    AccessRequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequest'
        nextCursor:
          type: string
          nullable: true
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller's role or path scope does not allow this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or the caller cannot read it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state, such as an existing path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
