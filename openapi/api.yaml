openapi: 3.0.3
info:
  title: Keysy API
  version: 0.0.0
  description: |
    The implemented application API provides the signed-in user's profile. It also lists the orgs the signed-in user belongs to, creates an org with the signed-in user as its owner, and lets owners soft-delete their orgs. It lists the signed-in user's sessions and revokes their other sessions. The unauthenticated `/health` endpoint reports process liveness. Other paths in this draft are not implemented.

    This is the v0 draft, not a stable release.

    This reference is generated from `openapi/api.yaml`, the source of truth for the application API.
servers:
  - url: https://api.keysy.net
  - url: http://localhost:8081
tags:
  - name: Account
    description: The signed-in user's profile and sessions.
  - name: Orgs
    description: Orgs the signed-in user belongs to, and their settings.
  - name: Members
    description: Org members and their Admin access.
  - name: Secrets
    description: Secret metadata and values.
  - name: Folders
    description: Folder versions, rollbacks, and service retrievals.
  - name: Policies
    description: Policies that grant their assignees read access to matching secrets.
  - name: Services
    description: Services and their tokens.
  - name: Reorganizations
    description: Secret moves and policy changes that the AI agent proposes.
  - name: Audit logs
    description: The org's audit log.
  - name: Health
    description: Process liveness.
security:
  - bearerAuth: []
paths:
  /v0/me:
    get:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: getMe
      summary: Get the signed-in user
      description: |
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string or request body is accepted.
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: updateMe
      summary: Update the signed-in user's profile
      description: |
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string is accepted. The UTF-8 JSON body is limited to 1024 bytes.
        The body must contain exactly one field, displayName or agentAutoApply. For displayName, the service trims whitespace,
        then accepts 1 to 32 Unicode code points.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [displayName]
                - required: [agentAutoApply]
              properties:
                displayName:
                  type: string
                  description: Whitespace is trimmed before the length is checked.
                agentAutoApply:
                  type: boolean
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/InvalidDisplayNameRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    options:
      tags: [Account]
      operationId: preflightMe
      security: []
      summary: CORS preflight for the profile route
      description: |
        Requires exactly one dashboard Origin and one Access-Control-Request-Method of GET or PATCH.
        The response advertises every method the shared CORS configuration allows: GET, POST, PATCH, and DELETE.
        Access-Control-Request-Headers may be absent or contain only Content-Type, case-insensitively.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
        - name: Access-Control-Request-Method
          in: header
          required: true
          schema:
            type: string
            enum: [GET, PATCH]
        - name: Access-Control-Request-Headers
          in: header
          schema:
            type: string
      responses:
        '204':
          description: Allowed. Access-Control-Allow-Origin echoes the dashboard origin, Access-Control-Allow-Credentials is true, Access-Control-Allow-Methods is GET, POST, PATCH, DELETE, and Access-Control-Allow-Headers is Content-Type.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Access-Control-Allow-Methods:
              schema:
                type: string
                enum: ['GET, POST, PATCH, DELETE']
            Access-Control-Allow-Headers:
              schema:
                type: string
                enum: [Content-Type]
        '403':
          $ref: '#/components/responses/InvalidPreflight'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/me/sessions:
    get:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: listMySessions
      summary: List the signed-in user's sessions
      description: |
        Returns every active Supabase Auth session of the signed-in user, and no other user's session. Sessions whose not_after has passed are excluded.
        The list includes the session that made this request, so it is not empty in practice. Clients must still accept an empty array.
        The list is sorted by lastUsedAt descending, then by id ascending. There is no pagination.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string or request body is accepted.
      responses:
        '200':
          description: The signed-in user's active sessions.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    options:
      tags: [Account]
      operationId: preflightMySessions
      security: []
      summary: CORS preflight for the sessions route
      description: |
        Requires exactly one dashboard Origin and one Access-Control-Request-Method of GET.
        The response advertises every method the shared CORS configuration allows: GET, POST, PATCH, and DELETE.
        Access-Control-Request-Headers may be absent or contain only Content-Type, case-insensitively.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
        - name: Access-Control-Request-Method
          in: header
          required: true
          schema:
            type: string
            enum: [GET]
        - name: Access-Control-Request-Headers
          in: header
          schema:
            type: string
      responses:
        '204':
          description: Allowed. Access-Control-Allow-Origin echoes the dashboard origin, Access-Control-Allow-Credentials is true, Access-Control-Allow-Methods is GET, POST, PATCH, DELETE, and Access-Control-Allow-Headers is Content-Type.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Access-Control-Allow-Methods:
              schema:
                type: string
                enum: ['GET, POST, PATCH, DELETE']
            Access-Control-Allow-Headers:
              schema:
                type: string
                enum: [Content-Type]
        '403':
          $ref: '#/components/responses/InvalidPreflight'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/me/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: revokeMySession
      summary: Revoke one of the signed-in user's other sessions
      description: |
        Deletes the session and its refresh tokens, so that device can no longer refresh its access token.
        An access token already issued to that session stays valid until it expires, up to the access token lifetime, because the api verifies access tokens locally.
        The current session cannot be revoked here and returns CURRENT_SESSION. It ends only through POST /v0/auth/logout on the auth service.
        Missing sessions and sessions of other users return SESSION_NOT_FOUND.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        sessionId must be a UUID. No query string or request body is accepted.
      responses:
        '204':
          description: The session and its refresh tokens are deleted. The response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/CurrentSessionRevoke'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    options:
      tags: [Account]
      operationId: preflightMySession
      security: []
      summary: CORS preflight for the session revocation route
      description: |
        Requires exactly one dashboard Origin and one Access-Control-Request-Method of DELETE.
        The response advertises every method the shared CORS configuration allows: GET, POST, PATCH, and DELETE.
        Access-Control-Request-Headers may be absent or contain only Content-Type, case-insensitively.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
        - name: Access-Control-Request-Method
          in: header
          required: true
          schema:
            type: string
            enum: [DELETE]
        - name: Access-Control-Request-Headers
          in: header
          schema:
            type: string
      responses:
        '204':
          description: Allowed. Access-Control-Allow-Origin echoes the dashboard origin, Access-Control-Allow-Credentials is true, Access-Control-Allow-Methods is GET, POST, PATCH, DELETE, and Access-Control-Allow-Headers is Content-Type.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Access-Control-Allow-Methods:
              schema:
                type: string
                enum: ['GET, POST, PATCH, DELETE']
            Access-Control-Allow-Headers:
              schema:
                type: string
                enum: [Content-Type]
        '403':
          $ref: '#/components/responses/InvalidPreflight'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/orgs:
    get:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: listOrgs
      summary: List the signed-in user's orgs
      description: |
        Returns every active org the signed-in user belongs to, and no other org. Soft-deleted orgs are excluded. Each memberCount is the total number of
        rows in public.members for that org. The list is sorted by name ascending, then by id ascending. The response
        is an empty array when the user has no membership. There is no pagination.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string or request body is accepted.
      responses:
        '200':
          description: The orgs the signed-in user belongs to.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMembership'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: createOrg
      summary: Create an org
      description: |
        Creates the org and the signed-in user's owner membership in one transaction. The new org has no other members.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string is accepted. The body must be UTF-8 JSON of at most 1024 bytes.
        The body must contain exactly one field, name. The service trims whitespace, then accepts 1 to 32 Unicode code points.
        Names must not contain null characters because PostgreSQL text cannot store them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: Whitespace is trimmed before the length is checked.
      responses:
        '201':
          description: The new org.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/InvalidOrgNameRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    options:
      tags: [Orgs]
      operationId: preflightOrgs
      security: []
      summary: CORS preflight for the orgs route
      description: |
        Requires exactly one dashboard Origin and one Access-Control-Request-Method of GET or POST.
        The response advertises every method the shared CORS configuration allows: GET, POST, PATCH, and DELETE.
        Access-Control-Request-Headers may be absent or contain only Content-Type, case-insensitively.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
        - name: Access-Control-Request-Method
          in: header
          required: true
          schema:
            type: string
            enum: [GET, POST]
        - name: Access-Control-Request-Headers
          in: header
          schema:
            type: string
      responses:
        '204':
          description: Allowed. Access-Control-Allow-Origin echoes the dashboard origin, Access-Control-Allow-Credentials is true, Access-Control-Allow-Methods is GET, POST, PATCH, DELETE, and Access-Control-Allow-Headers is Content-Type.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Access-Control-Allow-Methods:
              schema:
                type: string
                enum: ['GET, POST, PATCH, DELETE']
            Access-Control-Allow-Headers:
              schema:
                type: string
                enum: [Content-Type]
        '403':
          $ref: '#/components/responses/InvalidPreflight'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    delete:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: deleteOrg
      summary: Soft-delete an org
      description: |
        Only an owner of the target org can delete it. Sets deleted_at once and preserves memberships and user accounts.
        Deleted orgs are excluded from GET /v0/orgs. Permanent resource cleanup, including secrets, is tracked in issue #120.
        An owner retrying deletion of an already soft-deleted org receives 204 without changing deleted_at.
        Missing orgs and requests from non-owners return ORG_NOT_FOUND, including non-owner requests for deleted orgs.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        orgId must be a UUID. No query string or request body is accepted.
      responses:
        '204':
          description: The org is soft-deleted and the caller is an owner. Repeated deletion succeeds without another write. The response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/OrgNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    options:
      tags: [Orgs]
      operationId: preflightOrg
      security: []
      summary: CORS preflight for the org deletion route
      description: |
        Requires exactly one dashboard Origin and one Access-Control-Request-Method of DELETE.
        The response advertises every method the shared CORS configuration allows: GET, POST, PATCH, and DELETE.
        Access-Control-Request-Headers may be absent or contain only Content-Type, case-insensitively.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
        - name: Access-Control-Request-Method
          in: header
          required: true
          schema:
            type: string
            enum: [DELETE]
        - name: Access-Control-Request-Headers
          in: header
          schema:
            type: string
      responses:
        '204':
          description: Allowed. Access-Control-Allow-Origin echoes the dashboard origin, Access-Control-Allow-Credentials is true, Access-Control-Allow-Methods is GET, POST, PATCH, DELETE, and Access-Control-Allow-Headers is Content-Type.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Access-Control-Allow-Methods:
              schema:
                type: string
                enum: ['GET, POST, PATCH, DELETE']
            Access-Control-Allow-Headers:
              schema:
                type: string
                enum: [Content-Type]
        '403':
          $ref: '#/components/responses/InvalidPreflight'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/orgs/{orgId}/settings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Orgs]
      operationId: getOrgSettings
      summary: Get org settings
      description: Admin or Super Admin.
      responses:
        '200':
          description: Org settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Orgs]
      operationId: updateOrgSettings
      summary: Update org settings
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSettings'
      responses:
        '200':
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v0/orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members
      description: Admin or Super Admin.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Members]
      operationId: addMember
      summary: Add a member by email
      description: |
        Admin or Super Admin. The member gets the `user` role and no policies.
        The org appears for that user after they sign in with this email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [Members]
      operationId: updateMemberRole
      summary: Grant or revoke Admin access
      description: Super Admin only. A Super Admin's role cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, user]
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member
      description: |
        Admin or Super Admin can remove a user. Only a Super Admin can remove
        an Admin. A Super Admin cannot be removed.
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v0/orgs/{orgId}/secrets:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Secrets]
      operationId: listSecrets
      summary: List secrets
      description: Returns metadata only. Users and services see only secrets they can read.
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
          example: production/api/
        - name: q
          in: query
          description: Search text matched against paths.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Secrets]
      operationId: createSecret
      summary: Create a secret
      description: |
        Admin or Super Admin. Creates a new version of its folder. Returns
        `409` if a folder would hold both secrets and subfolders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
      responses:
        '201':
          description: Secret created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/secrets/{secretId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SecretId'
    get:
      tags: [Secrets]
      operationId: getSecret
      summary: Get secret metadata
      responses:
        '200':
          description: Secret metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Secrets]
      operationId: updateSecret
      summary: Update, move, or annotate a secret
      description: |
        Admin or Super Admin. Creates a new version of its folder; a move
        creates one in both the source and the destination folder. Versions
        beyond the retention limit N are permanently deleted. Returns `409`
        if a folder would hold both secrets and subfolders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdate'
      responses:
        '200':
          description: Secret updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      summary: Delete a secret
      description: Admin or Super Admin. Creates a new version of its folder.
      responses:
        '204':
          description: Secret deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/secrets/{secretId}/value:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SecretId'
    get:
      tags: [Secrets]
      operationId: getSecretValue
      summary: Retrieve a secret's current value
      description: Retrievals by a service update its retrieval record for the secret's folder.
      responses:
        '200':
          description: The current value.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/secret-values:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Secrets]
      operationId: listSecretValues
      summary: Retrieve current values under a path prefix
      description: |
        For the CLI and service runtime. Returns only readable secrets. The
        values from each folder come from one complete version of it.
        Retrievals by a service update its retrieval record for each folder.
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
          example: production/api/
      responses:
        '200':
          description: Current values.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretValue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v0/orgs/{orgId}/folder-versions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/FolderPath'
    get:
      tags: [Folders]
      operationId: listFolderVersions
      summary: List a folder's recent versions
      description: |
        Admin or Super Admin. Returns the current version and up to N previous
        versions, with what changed in each and without values.
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FolderVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/folder-rollbacks:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      tags: [Folders]
      operationId: rollBackFolder
      summary: Roll a folder back to a previous version
      description: |
        Admin or Super Admin. Creates a new version with the selected
        version's secrets; later versions are kept. Returns `409` if the
        folder would hold both secrets and subfolders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, version]
              properties:
                path:
                  $ref: '#/components/schemas/FolderPath'
                version:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Rollback version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/folder-retrievals:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/FolderPath'
    get:
      tags: [Folders]
      operationId: listFolderRetrievals
      summary: List each service's last retrieval
      description: Admin or Super Admin. One record per service, separate from audit logs.
      responses:
        '200':
          description: Last retrieval per service.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRetrieval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v0/orgs/{orgId}/policies:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: List policies
      description: Admin or Super Admin.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Policies]
      operationId: createPolicy
      summary: Create a policy
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreate'
      responses:
        '201':
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v0/orgs/{orgId}/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PolicyId'
    patch:
      tags: [Policies]
      operationId: updatePolicy
      summary: Update a policy
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdate'
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Policies]
      operationId: deletePolicy
      summary: Delete a policy
      description: Admin or Super Admin.
      responses:
        '204':
          description: Policy deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v0/orgs/{orgId}/services:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Services]
      operationId: listServices
      summary: List services
      description: Admin or Super Admin.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Services]
      operationId: createService
      summary: Create a service
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v0/orgs/{orgId}/services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
    delete:
      tags: [Services]
      operationId: deleteService
      summary: Delete a service and revoke its tokens
      description: Admin or Super Admin.
      responses:
        '204':
          description: Service deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/services/{serviceId}/tokens:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Services]
      operationId: listServiceTokens
      summary: List a service's tokens
      description: Admin or Super Admin. Token values are never returned.
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Services]
      operationId: createServiceToken
      summary: Issue a service token
      description: Admin or Super Admin. The token value is returned only once.
      responses:
        '201':
          description: Token issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ServiceToken'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/orgs/{orgId}/services/{serviceId}/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Services]
      operationId: revokeServiceToken
      summary: Revoke a service token
      description: Admin or Super Admin.
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v0/orgs/{orgId}/reorganizations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      tags: [Reorganizations]
      operationId: proposeReorganization
      summary: Propose an AI reorganization
      description: |
        Admin or Super Admin. The AI agent proposes secret moves and policy
        changes. Nothing changes until the proposal is applied. `accessDiff`
        lists every user and service whose readable secrets would change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction:
                  type: string
                  example: Move the Stripe and Resend keys into production/shared.
      responses:
        '201':
          description: Proposal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reorganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v0/orgs/{orgId}/reorganizations/{reorganizationId}/apply:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: reorganizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Reorganizations]
      operationId: applyReorganization
      summary: Apply a proposed reorganization
      description: |
        Admin or Super Admin. Applies all changes in one transaction and
        verifies the resulting access matches `accessDiff`. Each affected
        folder gets one new version. If secrets or
        policies changed since the proposal, verification fails, or a folder
        would hold both secrets and subfolders, nothing is applied and the
        API returns `409`.
      responses:
        '200':
          description: Reorganization applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reorganization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v0/orgs/{orgId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Audit logs]
      operationId: listAuditLogs
      summary: List audit logs
      description: |
        Admin or Super Admin. Records change attempts, including denied and
        failed ones; secret value retrievals are not audited. Records never
        contain secret values.
      parameters:
        - name: targetType
          in: query
          schema:
            $ref: '#/components/schemas/AuditTargetType'
        - name: targetId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of audit records, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      summary: Check process liveness
      description: |
        Reports that the process accepts requests. Does not check the database, JWKS, or other dependencies.
        Runs before request middleware, without authentication, request IDs, CORS allow headers, or telemetry.
      responses:
        '200':
          description: The process accepts requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Secure-keysy-access
      description: Encrypted access token cookie. On local HTTP the name is keysy-access. The auth service sets HttpOnly, SameSite=Lax, Path=/, Secure and Domain=COOKIE_DOMAIN in HTTPS mode; Max-Age is the access token lifetime.
    bearerAuth:
      type: http
      scheme: bearer
      description: A Supabase JWT for users, or a service token for services.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderPath:
      name: path
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/FolderPath'
    SecretId:
      name: secretId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    RequestID:
      description: Generated UUID; absent if ID generation fails.
      schema:
        type: string
        format: uuid
    AllowOrigin:
      description: Set to the matching dashboard origin after CORS validation.
      schema:
        type: string
    AllowCredentials:
      description: Set to true after CORS validation.
      schema:
        type: string
    NoStore:
      schema:
        type: string
        enum: [no-store]
  schemas:
    Role:
      type: string
      enum: [super_admin, admin, user]
    Me:
      type: object
      required: [id, email, displayName, agentAutoApply]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        agentAutoApply:
          type: boolean
        avatarUrl:
          type: string
          description: Present only when the token contains a valid HTTPS avatar URL.
    Session:
      type: object
      description: An active Supabase Auth session of the signed-in user.
      required: [id, client, device, lastUsedAt, current]
      properties:
        id:
          type: string
          format: uuid
          description: The Supabase session ID.
        client:
          type: string
          enum: [web]
          description: The client that created the session. Only web exists today. CLI and browser extension values will be added when those clients ship.
        device:
          type: string
          description: Derived from the User-Agent recorded at sign-in or refresh, formatted as `<Browser> on <OS>`, for example `Chrome on macOS`. The value is `Unknown device` when the User-Agent is missing or cannot be parsed.
          example: Chrome on macOS
        lastUsedAt:
          type: string
          format: date-time
          description: The last token refresh time of the session, or its creation time if it never refreshed. The value is approximate. It changes only when the access token is refreshed, so it can lag real use by up to the access token lifetime.
        current:
          type: boolean
          description: True for the session that made this request, matched by the session_id claim of the access token.
    Org:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    OrgMembership:
      type: object
      description: An org the signed-in user belongs to, and the user's role in that org.
      required: [id, name, role, memberCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, developer]
          description: The database role. This draft does not define the permissions of each role.
        memberCount:
          type: integer
          minimum: 1
          description: Total number of members in this org.
    OrgSettings:
      type: object
      required: [expirationReminderDays]
      properties:
        expirationReminderDays:
          type: integer
          minimum: 1
          description: Days before a secret's `expiresAt` when Admins receive a reminder.
    Member:
      type: object
      required: [id, email, role, userId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        userId:
          type: string
          format: uuid
          nullable: true
          description: Null until the member signs in for the first time.
        createdAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          type: string
          nullable: true
    SecretPath:
      type: string
      description: Slash-separated path. The last segment is the secret name.
      example: production/api/DATABASE_URL
    Secret:
      type: object
      required: [id, path, note, expiresAt, folderVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        path:
          $ref: '#/components/schemas/SecretPath'
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Expiration date. Admins are reminded `expirationReminderDays`
            before it. Keysy does not rotate or invalidate the secret.
        folderVersion:
          type: integer
          minimum: 1
          description: The current version of the secret's folder.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SecretPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        nextCursor:
          type: string
          nullable: true
    SecretCreate:
      type: object
      required: [path, value]
      properties:
        path:
          $ref: '#/components/schemas/SecretPath'
        value:
          type: string
        note:
          type: string
        expiresAt:
          type: string
          format: date-time
    SecretUpdate:
      type: object
      minProperties: 1
      properties:
        path:
          $ref: '#/components/schemas/SecretPath'
        value:
          type: string
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    FolderPath:
      type: string
      description: A secret path without its last segment. A folder holds either secrets or subfolders, never both.
      example: production/shared/resend
    FolderVersion:
      type: object
      required: [version, actorId, rollbackOf, changes, createdAt]
      properties:
        version:
          type: integer
          minimum: 1
        actorId:
          type: string
          format: uuid
          description: The user who made the change.
        rollbackOf:
          type: integer
          minimum: 1
          nullable: true
          description: The version this one restores, or null when it is not a rollback.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SecretChange'
        createdAt:
          type: string
          format: date-time
    SecretChange:
      type: object
      required: [secretId, name, change, fields]
      properties:
        secretId:
          type: string
          format: uuid
        name:
          type: string
          description: The secret's name in this folder after the change, or before it when it left the folder.
        change:
          type: string
          enum: [created, updated, deleted, moved_in, moved_out]
        fields:
          type: array
          description: The fields an `updated` change modified. Empty for other changes.
          items:
            type: string
            enum: [name, value, note, expiresAt]
    SecretValue:
      type: object
      required: [secretId, path, folderVersion, value]
      properties:
        secretId:
          type: string
          format: uuid
        path:
          $ref: '#/components/schemas/SecretPath'
        folderVersion:
          type: integer
          minimum: 1
          description: The folder version this value comes from.
        value:
          type: string
    ServiceRetrieval:
      type: object
      required: [serviceId, serviceName, version, retrievedAt]
      properties:
        serviceId:
          type: string
          format: uuid
        serviceName:
          type: string
        version:
          type: integer
          minimum: 1
          description: The folder version last retrieved.
        retrievedAt:
          type: string
          format: date-time
    Assignee:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [user, service]
        id:
          type: string
          format: uuid
          description: A member ID or a service ID.
    PathPattern:
      type: string
      description: An exact secret path, or a prefix ending in `/*`.
      example: production/api/*
    Policy:
      type: object
      required: [id, name, paths, assignees, createdAt, updatedAt]
      description: Grants its assignees read access to matching secrets.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        paths:
          type: array
          items:
            $ref: '#/components/schemas/PathPattern'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PolicyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        nextCursor:
          type: string
          nullable: true
    PolicyCreate:
      type: object
      required: [name, paths, assignees]
      properties:
        name:
          type: string
        paths:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PathPattern'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
    PolicyUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        paths:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PathPattern'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
    Service:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    ServicePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        nextCursor:
          type: string
          nullable: true
    ServiceToken:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    Reorganization:
      type: object
      required: [id, instruction, status, moves, policyChanges, accessDiff, createdAt]
      properties:
        id:
          type: string
          format: uuid
        instruction:
          type: string
        status:
          type: string
          enum: [proposed, applied]
        moves:
          type: array
          items:
            type: object
            required: [secretId, from, to]
            properties:
              secretId:
                type: string
                format: uuid
              from:
                $ref: '#/components/schemas/SecretPath'
              to:
                $ref: '#/components/schemas/SecretPath'
        policyChanges:
          type: array
          items:
            type: object
            required: [policyId, pathsBefore, pathsAfter]
            properties:
              policyId:
                type: string
                format: uuid
              pathsBefore:
                type: array
                items:
                  $ref: '#/components/schemas/PathPattern'
              pathsAfter:
                type: array
                items:
                  $ref: '#/components/schemas/PathPattern'
        accessDiff:
          type: array
          description: Empty when every user and service keeps the same readable secrets.
          items:
            type: object
            required: [assignee, gained, lost]
            properties:
              assignee:
                $ref: '#/components/schemas/Assignee'
              gained:
                type: array
                items:
                  type: string
                  format: uuid
                description: Secret IDs the assignee could newly read.
              lost:
                type: array
                items:
                  type: string
                  format: uuid
                description: Secret IDs the assignee could no longer read.
        createdAt:
          type: string
          format: date-time
    AuditTargetType:
      type: string
      enum: [secret, folder, policy, member, service]
    AuditLog:
      type: object
      required: [id, actorId, action, targetType, targetId, outcome, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          description: The user who made the change.
        action:
          type: string
          example: folder.version_created
        targetType:
          $ref: '#/components/schemas/AuditTargetType'
        targetId:
          type: string
          format: uuid
          nullable: true
          description: Null when the attempt never created its target, such as a denied or failed create.
        outcome:
          type: string
          enum: [success, denied, failed]
          description: '`denied` when authorization rejects the change; `failed` when an authorized change does not commit.'
        occurredAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        nextCursor:
          type: string
          nullable: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: secret_path_conflict
            message:
              type: string
  responses:
    OrgNotFound:
      description: ORG_NOT_FOUND. The org is missing or the caller is not an owner. Non-owner requests for deleted orgs also return this response.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionNotFound:
      description: SESSION_NOT_FOUND. The session is missing or belongs to another user. The response does not reveal which.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CurrentSessionRevoke:
      description: CURRENT_SESSION. sessionId is the session that made this request. The current session ends only through POST /v0/auth/logout on the auth service.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: INVALID_REQUEST.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidOrigin:
      description: INVALID_ORIGIN. This response has no CORS allow headers.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: INTERNAL_ERROR. Recovery before CORS can omit CORS headers and Cache-Control.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: KEYS_UNAVAILABLE or REQUEST_TIMEOUT.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidDisplayNameRequest:
      description: INVALID_REQUEST or INVALID_DISPLAY_NAME.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidOrgNameRequest:
      description: INVALID_REQUEST or INVALID_ORG_NAME.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidPreflight:
      description: INVALID_ORIGIN or INVALID_REQUEST. This response has no CORS allow headers.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller's role does not allow this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or the caller cannot read it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state, such as an existing path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
