openapi: 3.0.3
info:
  title: Keysy API
  version: 0.0.0
  description: |
    The implemented application API provides the signed-in user's profile. It also lists the orgs the signed-in user belongs to, creates an org with the signed-in user as its owner, lets owners rename and soft-delete their orgs. It lists the signed-in user's sessions and revokes their other sessions. It lists an org's members for any member of that org. The unauthenticated `/health` endpoint reports process liveness. Only implemented endpoints are listed.

    CORS allows credentialed requests from the dashboard origin only. Preflight accepts GET, POST, PATCH, and DELETE with at most the `Content-Type` request header on every path, and returns 204 with `Access-Control-Allow-Methods: GET, POST, PATCH, DELETE` and `Access-Control-Allow-Headers: Content-Type`. A preflight with any other origin, method, or header returns 403 `INVALID_ORIGIN` or `INVALID_REQUEST`.

    This is the v0 draft, not a stable release.

    This reference is generated from `openapi/api.yaml`, the source of truth for the application API.
servers:
  - url: https://api.keysy.net
  - url: http://localhost:8081
tags:
  - name: Account
    description: The signed-in user's profile and sessions.
  - name: Orgs
    description: Orgs the signed-in user belongs to, and their settings.
  - name: Members
    description: Org members and their roles.
  - name: Health
    description: Process liveness.
paths:
  /v0/me:
    get:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: getMe
      summary: Get the signed-in user
      description: |
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string or request body is accepted.
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: updateMe
      summary: Update the signed-in user's profile
      description: |
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string is accepted. The UTF-8 JSON body is limited to 1024 bytes.
        The body must contain exactly one field, displayName or agentAutoApply. For displayName, the service trims whitespace,
        then accepts 1 to 32 Unicode code points.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [displayName]
                - required: [agentAutoApply]
              properties:
                displayName:
                  type: string
                  description: Whitespace is trimmed before the length is checked.
                agentAutoApply:
                  type: boolean
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/InvalidDisplayNameRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/me/sessions:
    get:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: listMySessions
      summary: List the signed-in user's sessions
      description: |
        Returns every active Supabase Auth session of the signed-in user, and no other user's session. Sessions whose not_after has passed are excluded.
        The list includes the session that made this request, so it is not empty in practice. Clients must still accept an empty array.
        The list is sorted by lastUsedAt descending, then by id ascending. There is no pagination.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string or request body is accepted.
      responses:
        '200':
          description: The signed-in user's active sessions.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/me/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: revokeMySession
      summary: Revoke one of the signed-in user's other sessions
      description: |
        Deletes the session and its refresh tokens, so that device can no longer refresh its access token.
        An access token already issued to that session stays valid until it expires, up to the access token lifetime, because the api verifies access tokens locally.
        The current session cannot be revoked here and returns CURRENT_SESSION. It ends only through POST /v0/auth/logout on the auth service.
        Missing sessions and sessions of other users return SESSION_NOT_FOUND.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        sessionId must be a UUID. No query string or request body is accepted.
      responses:
        '204':
          description: The session and its refresh tokens are deleted. The response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/CurrentSessionRevoke'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/orgs:
    get:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: listOrgs
      summary: List the signed-in user's orgs
      description: |
        Returns every active org the signed-in user belongs to, and no other org. Soft-deleted orgs are excluded. Each memberCount is the total number of
        rows in public.members for that org. The list is sorted by name ascending, then by id ascending. The response
        is an empty array when the user has no membership. There is no pagination.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string or request body is accepted.
      responses:
        '200':
          description: The orgs the signed-in user belongs to.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMembership'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: createOrg
      summary: Create an org
      description: |
        Creates the org and the signed-in user's owner membership in one transaction. The new org has no other members.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        No query string is accepted. The body must be UTF-8 JSON of at most 1024 bytes.
        The body must contain exactly one field, name. The service trims whitespace, then accepts 1 to 32 Unicode code points.
        Names must not contain null characters because PostgreSQL text cannot store them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: Whitespace is trimmed before the length is checked.
      responses:
        '201':
          description: The new org.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/InvalidOrgNameRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    patch:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: renameOrg
      summary: Rename an org
      description: |
        Only an owner of the target org can rename it. Missing, soft-deleted, and non-owner requests return ORG_NOT_FOUND.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        orgId must be a UUID. No query string is accepted. The body must be UTF-8 JSON of at most 1024 bytes.
        The body must contain exactly one field, name. The service trims whitespace, then accepts 1 to 32 Unicode code points.
        Names must not contain null characters because PostgreSQL text cannot store them. Names need not be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: Whitespace is trimmed before the length is checked.
      responses:
        '200':
          description: The renamed org.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/InvalidOrgNameRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/OrgNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: deleteOrg
      summary: Soft-delete an org
      description: |
        Only an owner of the target org can delete it. Sets deleted_at once and preserves memberships and user accounts.
        Deleted orgs are excluded from GET /v0/orgs. Permanent resource cleanup, including secrets, is tracked in issue #120.
        An owner retrying deletion of an already soft-deleted org receives 204 without changing deleted_at.
        Missing orgs and requests from non-owners return ORG_NOT_FOUND, including non-owner requests for deleted orgs.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        orgId must be a UUID. No query string or request body is accepted.
      responses:
        '204':
          description: The org is soft-deleted and the caller is an owner. Repeated deletion succeeds without another write. The response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/OrgNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Members]
      security:
        - accessCookie: []
      operationId: listMembers
      summary: List an org's members
      description: |
        Every member of the org, whatever their role, can list its members. Each item shows only the member's name, email, and role.
        Access details are not included; they belong to the member page.
        Members whose accounts are deleted are not listed.
        The order is not specified; clients sort the list. There is no pagination (issue #157).
        Missing and soft-deleted orgs, and orgs the caller is not a member of, return ORG_NOT_FOUND.
        Responses include Cache-Control: no-store and a generated X-Request-ID. Recovery before CORS can omit Cache-Control and CORS headers. ID generation can fail.
        A matching dashboard Origin receives Access-Control-Allow-Origin and Access-Control-Allow-Credentials: true.
        Requests without Origin are accepted; other or repeated origins return INVALID_ORIGIN.
        orgId must be a UUID. No query string or request body is accepted.
      responses:
        '200':
          description: The org's members. The caller is always included.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          description: ORG_NOT_FOUND. The org is missing, soft-deleted, or the caller is not a member. The response does not reveal which.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      summary: Check process liveness
      description: |
        Reports that the process accepts requests. Does not check the database, JWKS, or other dependencies.
        Runs before request middleware, without authentication, request IDs, CORS allow headers, or telemetry.
      responses:
        '200':
          description: The process accepts requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Secure-keysy-access
      description: Encrypted access token cookie. On local HTTP the name is keysy-access. The auth service sets HttpOnly, SameSite=Lax, Path=/, Secure and Domain=COOKIE_DOMAIN in HTTPS mode; Max-Age is the access token lifetime.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RequestID:
      description: Generated UUID; absent if ID generation fails.
      schema:
        type: string
        format: uuid
    AllowOrigin:
      description: Set to the matching dashboard origin after CORS validation.
      schema:
        type: string
    AllowCredentials:
      description: Set to true after CORS validation.
      schema:
        type: string
    NoStore:
      schema:
        type: string
        enum: [no-store]
  schemas:
    Me:
      type: object
      required: [id, email, displayName, agentAutoApply]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        agentAutoApply:
          type: boolean
        avatarUrl:
          type: string
          description: Present only when the token contains a valid HTTPS avatar URL.
    Session:
      type: object
      description: An active Supabase Auth session of the signed-in user.
      required: [id, client, device, lastUsedAt, current]
      properties:
        id:
          type: string
          format: uuid
          description: The Supabase session ID.
        client:
          type: string
          enum: [web]
          description: The client that created the session. Only web exists today. CLI and browser extension values will be added when those clients ship.
        device:
          type: string
          description: Derived from the User-Agent recorded at sign-in or refresh, formatted as `<Browser> on <OS>`, for example `Chrome on macOS`. The value is `Unknown device` when the User-Agent is missing or cannot be parsed.
          example: Chrome on macOS
        lastUsedAt:
          type: string
          format: date-time
          description: The last token refresh time of the session, or its creation time if it never refreshed. The value is approximate. It changes only when the access token is refreshed, so it can lag real use by up to the access token lifetime.
        current:
          type: boolean
          description: True for the session that made this request, matched by the session_id claim of the access token.
    Org:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    OrgMembership:
      type: object
      description: An org the signed-in user belongs to, and the user's role in that org.
      required: [id, name, role, memberCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, developer]
          description: The database role. This draft does not define the permissions of each role.
        memberCount:
          type: integer
          minimum: 1
          description: Total number of members in this org.
    Member:
      type: object
      description: An org member as the member list shows it.
      required: [userId, name, email, role]
      properties:
        userId:
          type: string
          format: uuid
          description: Identifies the member within the org. The dashboard uses it to open the member page.
        name:
          type: string
          description: The member's display name from their profile.
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, developer]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: secret_path_conflict
            message:
              type: string
  responses:
    OrgNotFound:
      description: ORG_NOT_FOUND. The org is missing or the caller is not an owner. Non-owner requests for deleted orgs also return this response.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionNotFound:
      description: SESSION_NOT_FOUND. The session is missing or belongs to another user. The response does not reveal which.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CurrentSessionRevoke:
      description: CURRENT_SESSION. sessionId is the session that made this request. The current session ends only through POST /v0/auth/logout on the auth service.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: INVALID_REQUEST.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidOrigin:
      description: INVALID_ORIGIN. This response has no CORS allow headers.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
