openapi: 3.0.3
info:
  title: Keysy API
  version: 0.0.0
  description: |
    The application API provides Keysy's app features: orgs and members, secrets and their versions,
    access policies, services, AI reorganization, and audit logs.

    This reference is generated from `openapi/api.yaml`, the source of truth for the application API.
tags:
  - name: Orgs
  - name: Members
  - name: Secrets
  - name: Policies
  - name: Services
  - name: Reorganizations
  - name: Audit logs
security:
  - bearerAuth: []
paths:
  /v1/me:
    get:
      tags: [Orgs]
      operationId: getMe
      summary: Get the signed-in user and their orgs
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orgs:
    post:
      tags: [Orgs]
      operationId: createOrg
      summary: Create an org
      description: Any signed-in user can create an org and becomes its Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Org created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orgs/{orgId}/settings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Orgs]
      operationId: getOrgSettings
      summary: Get org settings
      description: Admin or Super Admin.
      responses:
        '200':
          description: Org settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Orgs]
      operationId: updateOrgSettings
      summary: Update org settings
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSettings'
      responses:
        '200':
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members
      description: Admin or Super Admin.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Members]
      operationId: addMember
      summary: Add a member by email
      description: |
        Admin or Super Admin. The member gets the `user` role and no policies.
        The org appears for that user after they sign in with this email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orgs/{orgId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [Members]
      operationId: updateMemberRole
      summary: Grant or revoke Admin access
      description: Super Admin only. A Super Admin's role cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, user]
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member
      description: |
        Admin or Super Admin can remove a user. Only a Super Admin can remove
        an Admin. A Super Admin cannot be removed.
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{orgId}/secrets:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Secrets]
      operationId: listSecrets
      summary: List secrets
      description: Returns metadata only. Users and services see only secrets they can read.
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
          example: production/api/
        - name: q
          in: query
          description: Search text matched against paths.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Secrets]
      operationId: createSecret
      summary: Create a secret
      description: Admin or Super Admin. Creates version 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
      responses:
        '201':
          description: Secret created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orgs/{orgId}/secrets/{secretId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SecretId'
    get:
      tags: [Secrets]
      operationId: getSecret
      summary: Get secret metadata
      responses:
        '200':
          description: Secret metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Secrets]
      operationId: updateSecret
      summary: Move a secret or update its note or expiration reminder
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdate'
      responses:
        '200':
          description: Secret updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      summary: Delete a secret
      description: Admin or Super Admin.
      responses:
        '204':
          description: Secret deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/secrets/{secretId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SecretId'
    get:
      tags: [Secrets]
      operationId: listSecretVersions
      summary: List recent versions
      description: Admin or Super Admin. Returns the current version and up to N previous versions, without values.
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Secrets]
      operationId: createSecretVersion
      summary: Update a secret's value
      description: |
        Admin or Super Admin. Creates a new version. Versions beyond the
        retention limit N are permanently deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        '201':
          description: Version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/secrets/{secretId}/retrievals:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SecretId'
    get:
      tags: [Secrets]
      operationId: listSecretRetrievals
      summary: List each service's last retrieval
      description: Admin or Super Admin. One record per service, separate from audit logs.
      responses:
        '200':
          description: Last retrieval per service.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRetrieval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/secrets/{secretId}/value:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SecretId'
    get:
      tags: [Secrets]
      operationId: getSecretValue
      summary: Retrieve a secret's current value
      description: Retrievals by a service update its retrieval record.
      responses:
        '200':
          description: The current value.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/secret-values:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Secrets]
      operationId: listSecretValues
      summary: Retrieve current values under a path prefix
      description: |
        For the CLI and service runtime. Returns only readable secrets. Each
        value comes from one complete version. Retrievals by a service update
        its retrieval records.
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
          example: production/api/
      responses:
        '200':
          description: Current values.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretValue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/orgs/{orgId}/policies:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: List policies
      description: Admin or Super Admin.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Policies]
      operationId: createPolicy
      summary: Create a policy
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreate'
      responses:
        '201':
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orgs/{orgId}/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PolicyId'
    patch:
      tags: [Policies]
      operationId: updatePolicy
      summary: Update a policy
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdate'
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Policies]
      operationId: deletePolicy
      summary: Delete a policy
      description: Admin or Super Admin.
      responses:
        '204':
          description: Policy deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{orgId}/services:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Services]
      operationId: listServices
      summary: List services
      description: Admin or Super Admin.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Services]
      operationId: createService
      summary: Create a service
      description: Admin or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orgs/{orgId}/services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
    delete:
      tags: [Services]
      operationId: deleteService
      summary: Delete a service and revoke its tokens
      description: Admin or Super Admin.
      responses:
        '204':
          description: Service deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/services/{serviceId}/tokens:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Services]
      operationId: listServiceTokens
      summary: List a service's tokens
      description: Admin or Super Admin. Token values are never returned.
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Services]
      operationId: createServiceToken
      summary: Issue a service token
      description: Admin or Super Admin. The token value is returned only once.
      responses:
        '201':
          description: Token issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ServiceToken'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/services/{serviceId}/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ServiceId'
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Services]
      operationId: revokeServiceToken
      summary: Revoke a service token
      description: Admin or Super Admin.
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{orgId}/reorganizations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      tags: [Reorganizations]
      operationId: proposeReorganization
      summary: Propose an AI reorganization
      description: |
        Admin or Super Admin. The AI agent proposes secret moves and policy
        changes. Nothing changes until the proposal is applied. `accessDiff`
        lists every user and service whose readable secrets would change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction:
                  type: string
                  example: Move the Stripe and Resend keys into production/shared.
      responses:
        '201':
          description: Proposal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reorganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orgs/{orgId}/reorganizations/{reorganizationId}/apply:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: reorganizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Reorganizations]
      operationId: applyReorganization
      summary: Apply a proposed reorganization
      description: |
        Admin or Super Admin. Applies all changes in one transaction and
        verifies the resulting access matches `accessDiff`. If secrets or
        policies changed since the proposal, or verification fails, nothing
        is applied and the API returns `409`.
      responses:
        '200':
          description: Reorganization applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reorganization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/orgs/{orgId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Audit logs]
      operationId: listAuditLogs
      summary: List audit logs
      description: |
        Admin or Super Admin. Records changes only; secret value retrievals
        are not audited. Records never contain secret values.
      parameters:
        - name: targetType
          in: query
          schema:
            $ref: '#/components/schemas/AuditTargetType'
        - name: targetId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of audit records, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Supabase JWT for users, or a service token for services.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SecretId:
      name: secretId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    NoStore:
      schema:
        type: string
        enum: [no-store]
  schemas:
    Role:
      type: string
      enum: [super_admin, admin, user]
    Me:
      type: object
      required: [id, email, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        memberships:
          type: array
          items:
            type: object
            required: [org, role]
            properties:
              org:
                $ref: '#/components/schemas/Org'
              role:
                $ref: '#/components/schemas/Role'
    Org:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    OrgSettings:
      type: object
      required: [expirationReminderDays]
      properties:
        expirationReminderDays:
          type: integer
          minimum: 1
          description: Days before a secret's `expiresAt` when Admins receive a reminder.
    Member:
      type: object
      required: [id, email, role, userId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        userId:
          type: string
          format: uuid
          nullable: true
          description: Null until the member signs in for the first time.
        createdAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          type: string
          nullable: true
    SecretPath:
      type: string
      description: Slash-separated path. The last segment is the secret name.
      example: production/api/DATABASE_URL
    Secret:
      type: object
      required: [id, path, note, expiresAt, currentVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        path:
          $ref: '#/components/schemas/SecretPath'
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Expiration date. Admins are reminded `expirationReminderDays`
            before it. Keysy does not rotate or invalidate the secret.
        currentVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SecretPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        nextCursor:
          type: string
          nullable: true
    SecretCreate:
      type: object
      required: [path, value]
      properties:
        path:
          $ref: '#/components/schemas/SecretPath'
        value:
          type: string
        note:
          type: string
        expiresAt:
          type: string
          format: date-time
    SecretUpdate:
      type: object
      minProperties: 1
      properties:
        path:
          $ref: '#/components/schemas/SecretPath'
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    SecretVersion:
      type: object
      required: [version, createdAt]
      properties:
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    SecretValue:
      type: object
      required: [secretId, path, version, value]
      properties:
        secretId:
          type: string
          format: uuid
        path:
          $ref: '#/components/schemas/SecretPath'
        version:
          type: integer
          minimum: 1
        value:
          type: string
    ServiceRetrieval:
      type: object
      required: [serviceId, serviceName, version, retrievedAt]
      properties:
        serviceId:
          type: string
          format: uuid
        serviceName:
          type: string
        version:
          type: integer
          minimum: 1
        retrievedAt:
          type: string
          format: date-time
    Assignee:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [user, service]
        id:
          type: string
          format: uuid
          description: A member ID or a service ID.
    PathPattern:
      type: string
      description: An exact secret path, or a prefix ending in `/*`.
      example: production/api/*
    Policy:
      type: object
      required: [id, name, paths, assignees, createdAt, updatedAt]
      description: Grants its assignees read access to matching secrets.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        paths:
          type: array
          items:
            $ref: '#/components/schemas/PathPattern'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PolicyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        nextCursor:
          type: string
          nullable: true
    PolicyCreate:
      type: object
      required: [name, paths, assignees]
      properties:
        name:
          type: string
        paths:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PathPattern'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
    PolicyUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        paths:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PathPattern'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
    Service:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    ServicePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        nextCursor:
          type: string
          nullable: true
    ServiceToken:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    Reorganization:
      type: object
      required: [id, instruction, status, moves, policyChanges, accessDiff, createdAt]
      properties:
        id:
          type: string
          format: uuid
        instruction:
          type: string
        status:
          type: string
          enum: [proposed, applied]
        moves:
          type: array
          items:
            type: object
            required: [secretId, from, to]
            properties:
              secretId:
                type: string
                format: uuid
              from:
                $ref: '#/components/schemas/SecretPath'
              to:
                $ref: '#/components/schemas/SecretPath'
        policyChanges:
          type: array
          items:
            type: object
            required: [policyId, pathsBefore, pathsAfter]
            properties:
              policyId:
                type: string
                format: uuid
              pathsBefore:
                type: array
                items:
                  $ref: '#/components/schemas/PathPattern'
              pathsAfter:
                type: array
                items:
                  $ref: '#/components/schemas/PathPattern'
        accessDiff:
          type: array
          description: Empty when every user and service keeps the same readable secrets.
          items:
            type: object
            required: [assignee, gained, lost]
            properties:
              assignee:
                $ref: '#/components/schemas/Assignee'
              gained:
                type: array
                items:
                  type: string
                  format: uuid
                description: Secret IDs the assignee could newly read.
              lost:
                type: array
                items:
                  type: string
                  format: uuid
                description: Secret IDs the assignee could no longer read.
        createdAt:
          type: string
          format: date-time
    AuditTargetType:
      type: string
      enum: [secret, policy, member, service]
    AuditLog:
      type: object
      required: [id, actorId, action, targetType, targetId, outcome, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          description: The user who made the change.
        action:
          type: string
          example: secret.version_created
        targetType:
          $ref: '#/components/schemas/AuditTargetType'
        targetId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [success, denied, failed]
        occurredAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        nextCursor:
          type: string
          nullable: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: secret_path_conflict
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller's role does not allow this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or the caller cannot read it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state, such as an existing path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
