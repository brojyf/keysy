openapi: 3.0.3
info:
  title: Keysy API
  version: 0.0.0
  description: |
    The Keysy API is the backend service behind the dashboard. It manages accounts, sessions, orgs, members, and invitations. This is the v0 draft.

    It does not cover sign-in or session renewal, which belong to the [auth service](/auth), or emails and notifications, which belong to the [notify service](/notify/overview).

    Source: `openapi/api.yaml`.
servers:
  - url: https://api.keysy.net
  - url: http://localhost:8081
tags:
  - name: Account
  - name: Orgs
  - name: Members
  - name: Invitations
  - name: Health
paths:
  /v0/me:
    get:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: getMe
      summary: Get the signed-in user
      description: Returns the signed-in user's profile.
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: deleteMe
      summary: Schedule deletion of the signed-in account
      description: |
        Schedules the signed-in account for deletion and revokes all its sessions. An access token already issued stays valid until it expires.
        An owner must transfer or delete their orgs first. A repeated request keeps the first deletion time.
      responses:
        '204':
          description: Account deletion is scheduled. The response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '409':
          $ref: '#/components/responses/OrgOwner'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: updateMe
      summary: Update the signed-in user's profile
      description: Updates the signed-in user's profile. The body must contain exactly one field, `displayName` or `agentAutoApply`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              example:
                displayName: Ada Lovelace
              properties:
                displayName:
                  type: string
                  description: 1 to 32 characters after surrounding whitespace is trimmed.
                agentAutoApply:
                  type: boolean
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/InvalidDisplayNameRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/me/sessions:
    get:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: listMySessions
      summary: List the signed-in user's sessions
      description: Returns all active sessions of the signed-in user, including the session that made this request. Sorted by `lastUsedAt`, newest first. There is no pagination.
      responses:
        '200':
          description: The signed-in user's active sessions.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/me/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Account]
      security:
        - accessCookie: []
      operationId: revokeMySession
      summary: Revoke one of the signed-in user's other sessions
      description: |
        Revokes one of the signed-in user's other sessions by deleting it and its refresh tokens. An access token already issued to that device stays valid until it expires.
        The current session cannot be revoked here. To end it, use `POST /v0/auth/logout` on the auth service.
      responses:
        '204':
          description: The session and its refresh tokens are deleted. The response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/CurrentSessionRevoke'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/orgs:
    get:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: listOrgs
      summary: List the signed-in user's orgs
      description: Returns all orgs the signed-in user belongs to. Sorted by name. There is no pagination.
      responses:
        '200':
          description: The orgs the signed-in user belongs to.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMembership'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: createOrg
      summary: Create an org
      description: Creates an org. The signed-in user becomes its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              example:
                name: Acme
              properties:
                name:
                  type: string
                  description: 1 to 32 characters after surrounding whitespace is trimmed.
      responses:
        '201':
          description: The new org.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/InvalidOrgNameRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OrgCreateForbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    patch:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: renameOrg
      summary: Rename an org
      description: Renames an org. Only an owner can rename it. Names need not be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              example:
                name: Acme
              properties:
                name:
                  type: string
                  description: 1 to 32 characters after surrounding whitespace is trimmed.
      responses:
        '200':
          description: The renamed org.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/InvalidOrgNameRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/OrgNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Orgs]
      security:
        - accessCookie: []
      operationId: deleteOrg
      summary: Permanently delete an org
      description: Permanently deletes an org and all its memberships. Only an owner can delete it. User accounts remain.
      responses:
        '204':
          description: The org and its memberships are permanently deleted. User accounts and profiles remain. The response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/OrgNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Members]
      security:
        - accessCookie: []
      operationId: listMembers
      summary: List an org's members
      description: Lists an org's members. Any member of the org can call it. Members with deleted accounts are not listed. The order is not specified. There is no pagination.
      responses:
        '200':
          description: The org's members. The caller is always included.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          description: ORG_NOT_FOUND. The org is missing or deleted, or the caller is not a member.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/orgs/{orgId}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Invitations]
      security:
        - accessCookie: []
      operationId: listInvitations
      summary: List an org's invitations
      description: Lists an org's pending and expired invitations. Any member of the org can call it. Invitations expire after 7 days. The order is not specified. There is no pagination.
      responses:
        '200':
          description: The org's pending and expired invitations, or an empty array.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          description: ORG_NOT_FOUND. The org is missing or deleted, or the caller is not a member.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      summary: Check process liveness
      description: Reports only that the process is alive. Does not check the database or other dependencies. No sign-in is required.
      responses:
        '200':
          description: The process accepts requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Secure-keysy-access
      description: The encrypted access token cookie. On local HTTP its name is `keysy-access`.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RequestID:
      description: A generated UUID.
      schema:
        type: string
        format: uuid
    AllowOrigin:
      description: The matching dashboard origin.
      schema:
        type: string
    AllowCredentials:
      description: Always `true`.
      schema:
        type: string
    NoStore:
      schema:
        type: string
        enum: [no-store]
  schemas:
    Me:
      type: object
      required: [id, email, displayName, agentAutoApply]
      example:
        id: 6f1c2a9e-3b7d-4e58-9a0c-1d2e3f4a5b6c
        email: ada@example.com
        displayName: Ada Lovelace
        agentAutoApply: false
        avatarUrl: https://lh3.googleusercontent.com/a/example
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        agentAutoApply:
          type: boolean
        avatarUrl:
          type: string
          description: Present only when there is a valid HTTPS avatar URL.
    Session:
      type: object
      description: An active Supabase Auth session of the signed-in user.
      required: [id, client, device, lastUsedAt, current]
      example:
        id: 2b7e4c1a-9d3f-4a6b-8c5e-7f0a1b2c3d4e
        client: web
        device: Chrome on macOS
        lastUsedAt: '2026-11-15T09:30:00Z'
        current: true
      properties:
        id:
          type: string
          format: uuid
          description: The Supabase session ID.
        client:
          type: string
          enum: [web]
          description: The client that created the session. Only `web` exists today.
        device:
          type: string
          description: Formatted as `<Browser> on <OS>`, for example `Chrome on macOS`. `Unknown device` when it cannot be detected.
          example: Chrome on macOS
        lastUsedAt:
          type: string
          format: date-time
          description: The last token refresh time. It is approximate and can lag real use by up to the access token lifetime.
        current:
          type: boolean
          description: True for the session that made this request.
    Org:
      type: object
      required: [id, name]
      example:
        id: 0c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
        name: Acme
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    OrgMembership:
      type: object
      description: An org the signed-in user belongs to, and the user's role in that org.
      required: [id, name, role, memberCount]
      example:
        id: 0c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
        name: Acme
        role: owner
        memberCount: 3
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, developer]
          description: The user's role in this org.
        memberCount:
          type: integer
          minimum: 1
          description: Total number of members in this org.
    Member:
      type: object
      description: An org member as the member list shows it.
      required: [userId, name, email, role]
      example:
        userId: 6f1c2a9e-3b7d-4e58-9a0c-1d2e3f4a5b6c
        name: Ada Lovelace
        email: ada@example.com
        role: owner
      properties:
        userId:
          type: string
          format: uuid
          description: The member's user ID.
        name:
          type: string
          description: The member's display name.
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, developer]
    Invitation:
      type: object
      description: An org invitation. It does not grant membership until accepted.
      required: [id, email, role, status]
      example:
        id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        email: grace@example.com
        role: developer
        status: pending
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, developer]
        status:
          type: string
          enum: [pending, expired]
          description: Becomes `expired` after 7 days.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_REQUEST
            message:
              type: string
  responses:
    OrgOwner:
      description: ORG_OWNER. The signed-in user still owns an org.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrgCreateForbidden:
      description: INVALID_ORIGIN, or ACCOUNT_DELETING when the account is scheduled for deletion.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrgNotFound:
      description: ORG_NOT_FOUND. The org is missing or deleted, or the caller is not an owner.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionNotFound:
      description: SESSION_NOT_FOUND. The session is missing or belongs to another user.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CurrentSessionRevoke:
      description: CURRENT_SESSION. The current session cannot be revoked here.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: INVALID_REQUEST.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidOrigin:
      description: INVALID_ORIGIN.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
