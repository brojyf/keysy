openapi: 3.0.3
info:
  title: Keysy Auth API
  version: 0.0.0
  description: |
    The Keysy authentication API (v0 draft). It signs users in with Google and manages their sessions.

    **Sign-in:** dashboard → `GET /v0/auth/google` → Google → `GET /v0/auth/callback` → cookies set → back to the dashboard.

    **Refresh:** when the API returns 401, the dashboard calls `POST /v0/auth/refresh` once, then retries. If the refresh fails, the dashboard goes to `/signin`.

    Tokens stay only in encrypted `HttpOnly` cookies.

    Source: `openapi/auth.yaml`.
servers:
  - url: https://auth.keysy.net
  - url: http://localhost:8080
tags:
  - name: Sign-in
  - name: Session
  - name: Health
paths:
  /v0/auth/google:
    get:
      tags: [Sign-in]
      operationId: startGoogleSignIn
      security: []
      summary: Start Google sign-in
      description: |
        Starts the Google authorization code flow with state, PKCE S256, and an OIDC nonce. The browser navigates here directly; it is not a CORS endpoint.
        The service sets an encrypted sign-in transaction cookie that expires after 10 minutes.
      responses:
        '302':
          description: Redirect to Google.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: The Google authorization URL.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The encrypted sign-in transaction cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/auth/callback:
    get:
      tags: [Sign-in]
      operationId: finishGoogleSignIn
      security: []
      summary: Finish Google sign-in
      description: |
        Google redirects the browser here. The service checks the sign-in transaction, exchanges the code for a Supabase session, sets the cookies, and redirects to the dashboard. A failure never leaves a partial session.
        The query must have exactly one of `code` or `error`. Unknown and repeated parameters are rejected.
      parameters:
        - name: __Host-keysy-oauth
          in: cookie
          required: true
          description: Encrypted sign-in transaction cookie; named keysy-oauth on local HTTP localhost.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The state value from the sign-in transaction. It has 22 to 128 characters from `A-Z`, `a-z`, `0-9`, `_`, and `-`.
          schema:
            type: string
            minLength: 22
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
        - name: code
          in: query
          required: false
          description: The Google authorization code. Send this or `error`, not both.
          schema:
            type: string
            maxLength: 4096
        - name: error
          in: query
          required: false
          description: The Google error code. Send this or `code`, not both. The service returns `SIGN_IN_FAILED`.
          schema:
            type: string
            maxLength: 4096
        - name: error_description
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: error_uri
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: scope
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: authuser
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: prompt
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: hd
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: iss
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        '303':
          description: Signed in. Redirect to the dashboard.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: The dashboard URL (`WEB_APP_URL`).
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: |
                Three cookies: the encrypted access cookie, the encrypted refresh cookie, and an expired
                `__Host-keysy-oauth` cookie that clears the sign-in transaction.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
        '400':
          description: |
            The request or the sign-in was rejected. The `code` is one of:
            `INVALID_REQUEST` (bad query, body, or `User-Agent`),
            `INVALID_LOGIN_TRANSACTION` (the transaction cookie is missing, duplicated, invalid, expired, or does not match `state`),
            or `SIGN_IN_FAILED` (Google returned `error`, or Google or Supabase rejected the sign-in).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: An expired `__Host-keysy-oauth` cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error. The `code` is `SIGN_IN_FAILED` or `INTERNAL_ERROR`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: The callback handler clears `__Host-keysy-oauth`; recovery before the handler can omit this cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            Google or Supabase sent an invalid response, or the session cookies are too large (over 4096 bytes).
            The `code` is `INVALID_PROVIDER_RESPONSE` or `SIGN_IN_FAILED`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: An expired `__Host-keysy-oauth` cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Google or Supabase is unavailable. The `code` is `SIGN_IN_FAILED`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: An expired `__Host-keysy-oauth` cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v0/auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Sign out
      description: |
        Revokes the current session and clears the three auth cookies. Other devices stay signed in. Access tokens already issued stay valid until they expire.
        Without a valid access cookie, the service first uses the refresh cookie to get an access token. A missing or invalid credential still clears the cookies.
        If Supabase is unavailable, the service keeps the session so the user can retry. If it refreshed the session before revocation failed, it sets the rotated access and refresh cookies.
      security:
        - {}
        - accessCookie: []
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Signed out. The response clears the three auth cookies.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: Expired `__Host-keysy-oauth`, `__Secure-keysy-access`, and `__Host-keysy-refresh` cookies.
              schema:
                type: string
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
        '400':
          description: Invalid request, such as a query string, a body, or duplicate session cookies. The `code` is `INVALID_REQUEST`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            Supabase is unavailable. The service keeps the session. The `code` is `LOGOUT_UNAVAILABLE`.
            If the service already refreshed the session, it sets the rotated access and refresh cookies.
          headers:
            Set-Cookie:
              description: If the service refreshed the session before revocation failed, the two rotated encrypted session cookies. Otherwise, this header is absent.
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      tags:
        - Session
      operationId: preflightLogout
      security: []
      summary: CORS preflight for the logout route
      description: Allows only the dashboard origin and the `POST` method. Custom request headers are not allowed.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: Access-Control-Request-Method
          in: header
          required: true
          description: Must be `POST`.
          schema:
            type: string
            enum: [POST]
      responses:
        '204':
          $ref: '#/components/responses/PreflightAllowed'
        '400':
          description: Invalid request (INVALID_REQUEST).
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PreflightRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/auth/refresh:
    post:
      tags: [Session]
      operationId: refreshSession
      summary: Renew the session
      description: Exchanges the refresh cookie with Supabase for new access and refresh cookies. The refresh token rotates on each use.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Renewed. The response has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: The new encrypted access and refresh cookies.
              schema:
                type: string
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
        '400':
          description: Invalid request, such as a query string, a body, or duplicate refresh cookies. The `code` is `INVALID_REQUEST`.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            The refresh cookie is missing or invalid, or Supabase rejected the refresh token. The `code` is `SESSION_EXPIRED`.
            The response clears the three auth cookies. Sign in again.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: Expired `__Host-keysy-oauth`, `__Secure-keysy-access`, and `__Host-keysy-refresh` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Supabase sent an invalid session, or the new cookies are too large. The service keeps the cookies. The `code` is `INVALID_PROVIDER_RESPONSE`.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Supabase is unavailable or rate limited. The service keeps the cookies. The `code` is `REFRESH_UNAVAILABLE`.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      tags:
        - Session
      operationId: preflightRefresh
      security: []
      summary: CORS preflight for the refresh route
      description: Allows only the dashboard origin and the `POST` method. Custom request headers are not allowed.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: Access-Control-Request-Method
          in: header
          required: true
          description: Must be `POST`.
          schema:
            type: string
            enum: [POST]
      responses:
        '204':
          $ref: '#/components/responses/PreflightAllowed'
        '400':
          description: Invalid request (INVALID_REQUEST).
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PreflightRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      summary: Check process liveness
      description: Reports only that the process is alive. Does not check Google, Supabase, or other dependencies. No sign-in is required.
      responses:
        '200':
          description: The process accepts requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Secure-keysy-access
      description: The encrypted Supabase access token. Set at sign-in on `COOKIE_DOMAIN` (`keysy.net` in production). On local HTTP its name is `keysy-access`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-keysy-refresh
      description: The encrypted Supabase refresh token. It is sent only to the auth origin. On local HTTP its name is `keysy-refresh`.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must equal the dashboard origin.
      schema:
        type: string
  headers:
    RequestID:
      description: A generated UUID.
      schema:
        type: string
        format: uuid
    CacheControl:
      description: Always `no-store`.
      schema:
        type: string
        enum: [no-store]
    ReferrerPolicy:
      description: Always `no-referrer`.
      schema:
        type: string
        enum: [no-referrer]
    AllowOrigin:
      description: The dashboard origin.
      schema:
        type: string
    AllowCredentials:
      description: Always `true`.
      schema:
        type: string
        enum: ['true']
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A stable error code, such as `INVALID_REQUEST`.
            message:
              type: string
              description: A short message that describes this error and may suggest an action.
  responses:
    InvalidRequest:
      description: Invalid request, such as a query string, a body, or an invalid `User-Agent`. The `code` is `INVALID_REQUEST`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal error. The `code` is `INTERNAL_ERROR`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidOrigin:
      description: The `Origin` header is missing, repeated, or not the dashboard origin. The `code` is `INVALID_ORIGIN`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreflightAllowed:
      description: The preflight is allowed. The response has no body.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
        Access-Control-Allow-Methods:
          description: The one allowed method for the route.
          schema:
            type: string
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
    PreflightRejected:
      description: A wrong origin returns `INVALID_ORIGIN`. A wrong method or a custom header returns `INVALID_REQUEST`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
