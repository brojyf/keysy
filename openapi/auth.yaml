openapi: 3.0.3
info:
  title: Keysy Auth API
  version: 0.0.0
  description: |
    The Keysy authentication API (v0 draft). It signs users in with Google and manages their sessions.

    **Sign-in:** dashboard → `GET /v0/auth/google` → Google → `GET /v0/auth/callback` → cookies set → back to the dashboard.

    **Refresh:** when the API returns 401, the dashboard calls `POST /v0/auth/refresh` once, then retries. If the refresh fails, the dashboard goes to `/signin`.

    The session lives in cookies that page scripts cannot read.

    Source: `openapi/auth.yaml`.
servers:
  - url: https://auth.keysy.net
  - url: http://localhost:8080
tags:
  - name: Sign-in
  - name: Session
  - name: Health
paths:
  /v0/auth/google:
    get:
      tags: [Sign-in]
      operationId: startGoogleSignIn
      security: []
      summary: Start Google sign-in
      description: Starts Google sign-in. The dashboard's sign-in button opens this URL, and the browser goes on to Google. Sign-in must finish within 10 minutes.
      responses:
        '302':
          description: Redirect to Google.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: The Google authorization URL.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The encrypted sign-in transaction cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/auth/callback:
    get:
      tags: [Sign-in]
      operationId: finishGoogleSignIn
      security: []
      summary: Finish Google sign-in
      description: Finishes Google sign-in. Google sends the browser back here, and the service signs the user in and returns them to the dashboard.
      parameters:
        - name: __Host-keysy-oauth
          in: cookie
          required: true
          description: Encrypted sign-in transaction cookie; named keysy-oauth on local HTTP localhost.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The state value from the sign-in transaction. It has 22 to 128 characters from `A-Z`, `a-z`, `0-9`, `_`, and `-`.
          schema:
            type: string
            minLength: 22
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
        - name: code
          in: query
          required: false
          description: The Google authorization code. Send this or `error`, not both.
          schema:
            type: string
            maxLength: 4096
        - name: error
          in: query
          required: false
          description: The Google error code. Send this or `code`, not both. The service returns `SIGN_IN_FAILED`.
          schema:
            type: string
            maxLength: 4096
        - name: error_description
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: error_uri
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: scope
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: authuser
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: prompt
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: hd
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: iss
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        '303':
          description: Signed in. Redirect to the dashboard.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: The dashboard URL (`WEB_APP_URL`).
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: |
                Three cookies: the encrypted access cookie, the encrypted refresh cookie, and an expired
                `__Host-keysy-oauth` cookie that clears the sign-in transaction.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
        '400':
          description: INVALID_REQUEST, INVALID_LOGIN_TRANSACTION, or SIGN_IN_FAILED. The sign-in was rejected or took too long.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: An expired `__Host-keysy-oauth` cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: SIGN_IN_FAILED or INTERNAL_ERROR.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: The callback handler clears `__Host-keysy-oauth`; recovery before the handler can omit this cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: INVALID_PROVIDER_RESPONSE or SIGN_IN_FAILED. Google or Supabase sent a bad response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: An expired `__Host-keysy-oauth` cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SIGN_IN_FAILED. Google or Supabase is unavailable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: An expired `__Host-keysy-oauth` cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v0/auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Sign out
      description: |
        Signs the user out on this device and clears the sign-in cookies. Other devices stay signed in.
        If sign-out fails, the user stays signed in and can try again; the response may set the rotated access and refresh cookies.
      security:
        - {}
        - accessCookie: []
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Signed out.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: Expired `__Host-keysy-oauth`, `__Secure-keysy-access`, and `__Host-keysy-refresh` cookies.
              schema:
                type: string
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
        '400':
          description: INVALID_REQUEST.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: LOGOUT_UNAVAILABLE. The user stays signed in and can try again. The response may set the rotated access and refresh cookies.
          headers:
            Set-Cookie:
              description: If the service refreshed the session before revocation failed, the two rotated encrypted session cookies. Otherwise, this header is absent.
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      tags:
        - Session
      operationId: preflightLogout
      security: []
      summary: CORS preflight for the logout route
      description: The browser's CORS check before the request. Only the dashboard may call this endpoint.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: Access-Control-Request-Method
          in: header
          required: true
          description: Must be `POST`.
          schema:
            type: string
            enum: [POST]
      responses:
        '204':
          $ref: '#/components/responses/PreflightAllowed'
        '400':
          description: INVALID_REQUEST.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PreflightRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/auth/refresh:
    post:
      tags: [Session]
      operationId: refreshSession
      summary: Renew the session
      description: Renews the session so the user stays signed in. The dashboard calls it when an API request returns 401.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Renewed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: The new encrypted access and refresh cookies.
              schema:
                type: string
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/AllowCredentials'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
        '400':
          description: INVALID_REQUEST.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: SESSION_EXPIRED. The user must sign in again.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: Expired `__Host-keysy-oauth`, `__Secure-keysy-access`, and `__Host-keysy-refresh` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: INVALID_PROVIDER_RESPONSE. Supabase sent a bad response.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: REFRESH_UNAVAILABLE. Try again later.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      tags:
        - Session
      operationId: preflightRefresh
      security: []
      summary: CORS preflight for the refresh route
      description: The browser's CORS check before the request. Only the dashboard may call this endpoint.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: Access-Control-Request-Method
          in: header
          required: true
          description: Must be `POST`.
          schema:
            type: string
            enum: [POST]
      responses:
        '204':
          $ref: '#/components/responses/PreflightAllowed'
        '400':
          description: INVALID_REQUEST.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PreflightRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      summary: Check process liveness
      description: Reports that the service is running. It does not check Google or Supabase.
      responses:
        '200':
          description: The service is running.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Secure-keysy-access
      description: The encrypted Supabase access token. Set at sign-in on `COOKIE_DOMAIN` (`keysy.net` in production). On local HTTP its name is `keysy-access`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-keysy-refresh
      description: The encrypted Supabase refresh token. It is sent only to the auth origin. On local HTTP its name is `keysy-refresh`.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must equal the dashboard origin.
      schema:
        type: string
  headers:
    RequestID:
      description: A generated UUID.
      schema:
        type: string
        format: uuid
    CacheControl:
      description: Always `no-store`.
      schema:
        type: string
        enum: [no-store]
    ReferrerPolicy:
      description: Always `no-referrer`.
      schema:
        type: string
        enum: [no-referrer]
    AllowOrigin:
      description: The dashboard origin.
      schema:
        type: string
    AllowCredentials:
      description: Always `true`.
      schema:
        type: string
        enum: ['true']
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A stable error code, such as `INVALID_REQUEST`.
            message:
              type: string
              description: A short message that describes this error and may suggest an action.
  responses:
    InvalidRequest:
      description: INVALID_REQUEST.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: INTERNAL_ERROR.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidOrigin:
      description: INVALID_ORIGIN. The request did not come from the dashboard.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreflightAllowed:
      description: Allowed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AllowCredentials'
        Access-Control-Allow-Methods:
          description: The one allowed method for the route.
          schema:
            type: string
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
    PreflightRejected:
      description: INVALID_ORIGIN or INVALID_REQUEST.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
