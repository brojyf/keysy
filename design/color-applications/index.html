<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keysy · Dashboard 与文档配色对照</title>
  <link rel="stylesheet" href="preview.css">
  <script src="../../web/mockups/palettes.js" defer></script>
  <script src="../../web/mockups/palettes-extra.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <header class="workbench-header">
    <div class="workbench-heading"><a href="../../web/mockups/review.html">keysy / design studies</a><span>10 套颜色 · 2 种布局 · 深浅模式</span></div>
    <div class="workbench-controls">
      <div class="segmented" role="group" aria-label="参考布局">
        <button type="button" data-layout="supabase" aria-pressed="true">Supabase Dashboard</button>
        <button type="button" data-layout="mintlify" aria-pressed="false">Mintlify 文档</button>
      </div>
      <label class="palette-select">配色 <select id="palette-select" aria-label="放大预览配色"></select></label>
      <div class="segmented" role="group" aria-label="外观模式">
        <button type="button" data-mode="light" aria-pressed="true">浅色</button>
        <button type="button" data-mode="dark" aria-pressed="false">深色</button>
      </div>
      <a class="gallery-link" href="#comparison">看全部配色 ↓</a>
    </div>
  </header>
  <main>
    <section id="focus" aria-labelledby="focus-title">
      <header class="section-heading"><div><p class="eyebrow">IN CONTEXT / 01</p><h1 id="focus-title"></h1></div><p id="focus-status" role="status" aria-live="polite"></p></header>
      <div id="focus-preview"></div>
      <p id="layout-note" class="layout-note"></p>
    </section>
    <section id="comparison" aria-labelledby="comparison-title">
      <header class="section-heading"><div><p class="eyebrow">SIDE BY SIDE / 02</p><h2 id="comparison-title">每套颜色，同一张界面。</h2></div><p>点击「放大」查看细节；原色值保持不变。</p></header>
      <div id="palette-gallery"></div>
    </section>
    <footer>仅作视觉比较。Dashboard 使用虚构数据；文档内容来自 design 下的 docs 副本。<a href="README.md">参考与说明</a></footer>
    <noscript>请启用 JavaScript 查看配色对照。</noscript>
  </main>
</body>
</html>
