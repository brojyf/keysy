<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keysy Update Secret Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Light theme tokens from design/theme */
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #1b1c1e;
    --muted: #64666b;
    --accent: #1d4ed8;
    --button: #2f5aba;
    --soft: #f0f1f3;
    --line: #e3e4e6;
    --added: #f4f7fe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Section copy (matches the Dashboard section in Figma) */
  .section { padding: 96px 16px 120px; text-align: center; }
  .eyebrow { margin: 0; color: var(--accent); font: 600 12px "Geist Mono", monospace; letter-spacing: 0.08em; }
  h2 { margin: 14px 0 0; font-size: 44px; font-weight: 600; line-height: 48px; letter-spacing: -0.035em; }
  .desc { max-width: 560px; margin: 14px auto 0; color: var(--muted); font-size: 17px; line-height: 26px; }

  /* Stage: fixed 1000px composition, shown at 90% and scaled down to fit */
  .stage-wrap { position: relative; max-width: 900px; margin: 56px auto 0; text-align: left; }
  .stage-wrap::before {
    content: "";
    position: absolute;
    left: 7%;
    right: 7%;
    top: 30%;
    height: 60%;
    border-radius: 50%;
    background: rgba(29, 78, 216, 0.2);
    filter: blur(60px);
  }
  .stage { position: relative; width: 1000px; transform-origin: top left; }
  .beam {
    padding: 1px;
    border-radius: 21px;
    background: linear-gradient(135deg, rgba(29, 78, 216, 0.85), #e3e4e6 35%, #e3e4e6 70%, rgba(122, 162, 255, 0.9));
    box-shadow: 0 40px 80px -24px rgba(29, 78, 216, 0.16), 0 2px 6px rgba(16, 27, 48, 0.06);
  }
  .window { border-radius: 20px; background: var(--surface); overflow: hidden; }
  .chrome { position: relative; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  .chrome .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .address {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    padding: 5px 12px;
    border-radius: 8px;
    background: var(--soft);
    color: var(--muted);
    font: 400 12px "Geist Mono", monospace;
  }
  .body { position: relative; display: grid; grid-template-columns: 184px 1fr; height: 578px; overflow: hidden; }

  .sidebar { padding: 20px 14px; background: var(--bg); border-right: 1px solid var(--line); }
  .sidebar h4 { margin: 0 0 12px; font-size: 12px; font-weight: 700; }
  .nav { padding: 8px 10px; margin-bottom: 4px; border-radius: 8px; color: var(--muted); font-size: 13px; }
  .nav.active { background: var(--soft); color: var(--text); font-weight: 500; }

  .main { padding: 26px 24px; display: flex; flex-direction: column; gap: 18px; }
  .main-head { display: flex; justify-content: space-between; align-items: center; }
  .main-head h3 { margin: 0; font-size: 22px; font-weight: 600; }
  .main-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .new { padding: 7px 12px; border-radius: 8px; background: var(--button); color: #fff; font-size: 12px; font-weight: 500; }
  .table { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tr { display: grid; grid-template-columns: 1fr 76px 88px; gap: 12px; align-items: center; padding: 13px 16px; background: var(--surface); }
  .tr + .tr { border-top: 1px solid var(--line); }
  .tr.th { padding: 9px 16px; background: var(--bg); color: var(--muted); font: 500 11px "Geist Mono", monospace; letter-spacing: 0.06em; }
  .tr.selected { background: var(--added); }
  .path { font: 400 13px "Geist Mono", monospace; white-space: nowrap; }
  .path .pre { color: var(--muted); }
  .ver { font: 400 13px "Geist Mono", monospace; color: var(--muted); }
  .badge { justify-self: start; padding: 3px 8px; border-radius: 999px; background: #e8eefc; color: var(--accent); font-size: 11px; font-weight: 500; }
  .dash { color: var(--muted); }
  .foot { color: var(--muted); font-size: 12px; }

  /* Update secret side panel */
  .scrim { position: absolute; inset: 0; background: rgba(16, 27, 48, 0.06); opacity: 0; pointer-events: none; }
  .panel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px 16px 16px;
    background: var(--bg);
    border-left: 1px solid var(--line);
    box-shadow: -24px 0 48px -24px rgba(16, 27, 48, 0.18);
    transform: translateX(100%);
  }
  .panel h5 { margin: 0; font-size: 13px; font-weight: 600; }
  .field { position: relative; display: flex; flex-direction: column; gap: 6px; }
  .field label { color: var(--muted); font-size: 11px; font-weight: 500; }
  .input {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    font-size: 12px;
    transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
  }
  .input.focused { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
  .input .v { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .input .v.mono { font-family: "Geist Mono", monospace; }
  .input .v:empty::before { content: attr(data-placeholder); color: var(--muted); }
  .input .hint { color: var(--muted); font-size: 11px; font-weight: 500; }
  .menu {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 4px);
    z-index: 1;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: 0 12px 28px -8px rgba(16, 27, 48, 0.22);
    font-size: 12px;
    transform-origin: top center;
  }
  .option { padding: 7px 8px; border-radius: 6px; }
  .option.hover { background: var(--soft); }
  .panel .grow { flex: 1; }
  .actions { display: flex; gap: 8px; }
  .btn { flex: 1; display: grid; place-items: center; height: 34px; border-radius: 8px; font-size: 12px; font-weight: 500; }
  .btn.ghost { border: 1px solid var(--line); background: var(--surface); }
  .btn.primary { background: var(--button); color: #fff; }

  @media (max-width: 720px) {
    h2 { font-size: 32px; line-height: 36px; }
  }
</style>
</head>
<body>
<section class="section">
  <p class="eyebrow">DASHBOARD</p>
  <h2>From paste<br>to protected.</h2>
  <p class="desc">Paste a new value and reset the reminder. Keysy hides the value, and every save adds a version to its folder.</p>
  <div class="stage-wrap" id="stageWrap"></div>
</section>

<template id="stageTemplate">
<div class="stage">
  <div class="beam">
    <div class="window">
      <div class="chrome">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="address">keysy / acme / production</span>
      </div>
      <div class="body">
        <aside class="sidebar">
          <h4>Workspace</h4>
          <div class="nav active">Secrets</div>
          <div class="nav">Access policies</div>
          <div class="nav">Version history</div>
          <div class="nav">Audit logs</div>
          <div class="nav">AI assistant</div>
        </aside>
        <div class="main">
          <div class="main-head">
            <div><h3>Secrets</h3><p>Everything in its right place.</p></div>
            <span class="new">+ New secret</span>
          </div>
          <div class="table">
            <div class="tr th"><span>PATH</span><span>CHANGED IN</span><span>EXPIRES</span></div>
          </div>
          <div class="foot">7 secrets · Values hidden by default</div>
        </div>
        <div class="scrim"></div>
        <aside class="panel">
          <h5>Update secret</h5>
          <div class="field" data-field="path"><label>Path</label><div class="input"><span class="v mono"></span></div></div>
          <div class="field" data-field="value"><label>Value</label><div class="input"><span class="v mono" data-placeholder="Paste a new value"></span><span class="hint">Hidden</span></div></div>
          <div class="field" data-field="expires"><label>Expires</label><div class="input"><span class="v"></span><span class="hint">⌄</span></div></div>
          <div class="field" data-field="note"><label>Note</label><div class="input"><span class="v"></span></div></div>
          <div class="grow"></div>
          <div class="actions"><span class="btn ghost">Cancel</span><span class="btn primary">Save secret</span></div>
        </aside>
      </div>
    </div>
  </div>
</div>
</template>

<script type="module">
  import { animate } from 'https://cdn.jsdelivr.net/npm/motion@12.23.12/+esm';

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STAGE_W = 1000, STAGE_H = 624, STAGE_SCALE = 0.9;

  // ---------- Springs (bounce 0 = critically damped, visualDuration ≈ response) ----------
  const FADE = {duration: 0.2, ease: 'easeOut'};
  const EXIT = {duration: 0.15, ease: 'easeIn'};
  const spring = (visualDuration, bounce = 0) => ({type: 'spring', visualDuration, bounce, opacity: FADE, filter: FADE});
  const SNAPPY = spring(0.3);
  const SURFACE = spring(0.55);
  const PRESS = {duration: 0.1, ease: 'easeOut'};

  // ---------- Content ----------
  // The first row is the secret being updated
  const SECRETS = [
    {pre: 'production/shared/', key: 'STRIPE_SECRET_KEY', ver: 'v5', exp: 'in 14 days', note: 'Rotate in the Stripe dashboard'},
    {pre: 'production/api/', key: 'DATABASE_URL', ver: 'v8'},
    {pre: 'production/api/', key: 'REDIS_URL', ver: 'v6'},
    {pre: 'production/api/', key: 'SENTRY_DSN', ver: 'v7'},
    {pre: 'production/payments/', key: 'WEBHOOK_SECRET', ver: 'v3', exp: 'in 30 days'},
    {pre: 'production/shared/', key: 'RESEND_API_KEY', ver: 'v5'},
    {pre: 'production/ci/', key: 'DEPLOY_TOKEN', ver: 'v2'},
  ];
  const TARGET = SECRETS[0];
  // Saving adds a version to production/shared (v5 → v6) and resets the reminder
  const UPDATED = {ver: 'v6', exp: 'in 90 days'};
  const MASKED_VALUE = '•'.repeat(18);
  const EXPIRY_OPTIONS = ['Never', 'in 30 days', 'in 90 days'];

  // ---------- Run control: replays abort the running timeline ----------
  let runId = 0;
  class Aborted extends Error {}
  function createRun() {
    const id = ++runId;
    const guard = () => { if (id !== runId) throw new Aborted(); };
    return {
      guard,
      wait: async ms => { await new Promise(r => setTimeout(r, ms)); guard(); },
      play: async (target, keyframes, options) => { await animate(target, keyframes, options); guard(); },
    };
  }
  const whenVisible = () => document.hidden ? new Promise(r => document.addEventListener('visibilitychange', r, {once: true})) : null;

  // ---------- DOM ----------
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  function secretRow(secret) {
    const row = el('div', 'tr'), path = el('span', 'path');
    path.append(el('span', 'pre', secret.pre), secret.key);
    row.append(path, el('span', 'ver', secret.ver), secret.exp ? el('span', 'badge', secret.exp) : el('span', 'dash', '—'));
    return row;
  }

  const stageWrap = document.getElementById('stageWrap');
  const template = document.getElementById('stageTemplate');
  let currentStage = null;
  function fitStage() {
    if (!currentStage) return;
    const scale = Math.min(STAGE_SCALE, stageWrap.clientWidth / STAGE_W);
    currentStage.style.transform = `scale(${scale})`;
    stageWrap.style.height = `${STAGE_H * scale}px`;
  }
  addEventListener('resize', fitStage);

  function mountScene() {
    stageWrap.replaceChildren(template.content.cloneNode(true));
    const q = sel => stageWrap.querySelector(sel);
    const field = name => {
      const root = q(`[data-field="${name}"]`);
      return {root, input: root.querySelector('.input'), value: root.querySelector('.v')};
    };
    const scene = {
      stage: q('.stage'), table: q('.table'),
      scrim: q('.scrim'), panel: q('.panel'), save: q('.btn.primary'),
      path: field('path'), value: field('value'), expires: field('expires'), note: field('note'),
    };
    scene.table.append(...SECRETS.map(secretRow));
    scene.target = scene.table.querySelector('.tr:not(.th)');
    currentStage = scene.stage;
    fitStage();
    return scene;
  }

  // ---------- Steps ----------
  async function press(run, node) {
    await run.play(node, {scale: 0.96}, PRESS);
    animate(node, {scale: 1}, SNAPPY);
  }
  const focus = field => field.input.classList.add('focused');
  const blur = field => field.input.classList.remove('focused');

  async function pickExpiry(run, field, choice) {
    focus(field);
    const menu = el('div', 'menu');
    const options = EXPIRY_OPTIONS.map(text => el('div', 'option', text));
    menu.append(...options);
    field.root.append(menu);
    await run.play(menu, {opacity: [0, 1], scale: [0.97, 1], y: [-4, 0]}, SNAPPY);
    for (const option of options) {
      options.forEach(o => o.classList.toggle('hover', o === option));
      await run.wait(170);
      if (option.textContent === choice) break;
    }
    await run.wait(160);
    field.value.textContent = choice;
    await run.play(menu, {opacity: 0, scale: 0.98}, EXIT);
    menu.remove();
    blur(field);
  }

  async function openPanel(run, scene) {
    await press(run, scene.target);
    scene.target.classList.add('selected');
    scene.path.value.textContent = TARGET.pre + TARGET.key;
    scene.expires.value.textContent = TARGET.exp;
    scene.note.value.textContent = TARGET.note;
    animate(scene.scrim, {opacity: [0, 1]}, {duration: 0.25, ease: 'easeOut'});
    await run.play(scene.panel, {x: ['100%', '0%']}, SURFACE);
  }
  async function closePanel(run, scene) {
    animate(scene.scrim, {opacity: 0}, {duration: 0.2, ease: 'easeIn'});
    await run.play(scene.panel, {x: '100%'}, spring(0.4));
  }

  // The row stays in place; its version and reminder swap to the saved values
  function applyUpdate(row) {
    row.querySelector('.ver').textContent = UPDATED.ver;
    row.querySelector('.badge').textContent = UPDATED.exp;
  }
  async function updateRow(run, scene) {
    const row = scene.target, cells = [row.querySelector('.ver'), row.querySelector('.badge')];
    animate(row, {backgroundColor: ['#dfe7fb', '#f4f7fe']}, {duration: 0.9, ease: 'easeOut'});
    await run.play(cells, {opacity: 0, y: -6}, EXIT);
    applyUpdate(row);
    await run.play(cells, {opacity: [0, 1], y: [6, 0]}, SNAPPY);
  }

  async function playStory(run, scene) {
    await run.wait(700);
    await openPanel(run, scene);

    // Paste: the whole value lands at once, already masked
    focus(scene.value);
    await run.wait(380);
    scene.value.value.textContent = MASKED_VALUE;
    await run.play(scene.value.value, {opacity: [0, 1], filter: ['blur(3px)', 'blur(0px)']}, SNAPPY);
    await run.wait(250);
    blur(scene.value);

    await pickExpiry(run, scene.expires, UPDATED.exp);

    await run.wait(250);
    await press(run, scene.save);
    await run.wait(180);
    await closePanel(run, scene);
    await updateRow(run, scene);
    await run.wait(2600);
  }

  function renderFinal(scene) {
    scene.target.classList.add('selected');
    applyUpdate(scene.target);
  }

  async function start() {
    const run = createRun();
    if (reducedMotion) { renderFinal(mountScene()); return; }
    try {
      for (let first = true; ; first = false) {
        await whenVisible();
        run.guard();
        const scene = mountScene();
        if (!first) await run.play(scene.stage, {opacity: [0, 1]}, {duration: 0.4, ease: 'easeOut'});
        await playStory(run, scene);
        await run.play(scene.stage, {opacity: 0}, {duration: 0.35, ease: 'easeIn'});
      }
    } catch (e) {
      if (!(e instanceof Aborted)) throw e;
    }
  }
  start();
</script>
</body>
</html>
