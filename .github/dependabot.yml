version: 2
updates:
  - package-ecosystem: bun
    directories:
      - '/**'
    schedule:
      interval: cron
      cronjob: '0 0 * * mon%2'
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: cron
      cronjob: '0 0 * * mon%2'
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 * * mon%2'
    commit-message:
      prefix: chore
      include: scope
