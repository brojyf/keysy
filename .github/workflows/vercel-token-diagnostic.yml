name: Vercel Token Diagnostic

on:
  push:
    branches: [chore/vercel-token-diagnostic]

permissions: {}

jobs:
  inspect-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Check Vercel identity and project access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: '1'
        run: |
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_PROJECT_ID}"

          get_status() {
            curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
              --variable %VERCEL_TOKEN --expand-header 'Authorization: Bearer {{VERCEL_TOKEN}}' "$1"
          }

          user_status=$(get_status 'https://api.vercel.com/v2/user')
          project_status=$(get_status "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          echo "Current user: HTTP $user_status"
          echo "Configured project: HTTP $project_status"

          whoami_status=0
          bunx vercel@64.0.2 whoami --non-interactive > /dev/null || whoami_status=$?
          echo "Vercel CLI whoami: exit $whoami_status"
          [[ "$user_status" == 200 && "$project_status" == 200 && "$whoami_status" == 0 ]]
