name: Discord Merge Notification

# Called before and after Fly deployment to create, then edit, one message.
on:
  workflow_call:
    inputs:
      message_id:
        type: string
        default: ''
      deploy_result:
        type: string
        default: pending
      deployed:
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK_URL:
        required: true
    outputs:
      message_id:
        description: Discord message to update after deployment
        value: ${{ jobs.notify.outputs.message_id }}

permissions:
  contents: read

jobs:
  # Does not check out or run repository code, so the webhook secret stays safe.
  notify:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      message_id: ${{ steps.message.outputs.message_id }}
    steps:
      - name: Notify Discord
        id: message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MESSAGE_ID: ${{ inputs.message_id }}
          DEPLOY_RESULT: ${{ inputs.deploy_result }}
          DEPLOYED: ${{ inputs.deployed }}
        run: |
          # First path segment of each changed file, e.g. "dashboard / wiki".
          # Falls back so an API failure does not drop the whole message.
          scope=$(gh api "repos/$REPO/commits/$COMMIT_SHA" \
            --jq '[.files[].filename | split("/")[0]] | unique | join(" / ")') \
            || scope="unknown"

          # allowed_mentions blocks pings such as @everyone in commit messages.
          payload=$(jq -n \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg message "${COMMIT_MESSAGE%%$'\n'*}" \
            --arg scope "$scope" \
            --arg author "$COMMIT_AUTHOR" \
            --arg conclusion "$CI_CONCLUSION" \
            --arg deploy_result "$DEPLOY_RESULT" \
            --arg deployed "$DEPLOYED" \
            '{content: ("### " + $sha + ": " + $message +
              "\nScope: " + $scope +
              "\nBy: " + $author +
              "\nCI: " + (if $conclusion == "success" then "✅ Passed" else "❌ " + $conclusion end) +
              "\nFly deploy: " +
              (if $conclusion != "success" then "⏭️ Not run (CI did not pass)"
               elif $deploy_result == "pending" then "⏳ Pending"
               elif $deploy_result == "failure" then "❌ Failed"
               elif $deploy_result == "cancelled" then "🚫 Cancelled"
               elif $deploy_result == "success" and $deployed == "true" then "✅ Succeeded"
               else "⏭️ Skipped" end)),
              allowed_mentions: {parse: []}}')

          if [ -n "$MESSAGE_ID" ]; then
            curl --fail-with-body -sS -X PATCH \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$WEBHOOK_URL/messages/$MESSAGE_ID" > /dev/null
          else
            response=$(curl --fail-with-body -sS \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$WEBHOOK_URL?wait=true")
            message_id=$(jq -er '.id | strings | select(test("^[0-9]+$"))' <<< "$response")
            echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
          fi
