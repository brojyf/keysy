name: Discord Merge Notification

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  # Does not check out or run PR code, so the webhook secret stays safe.
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # allowed_mentions blocks pings such as @everyone in PR titles.
          payload=$(jq -n \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            '{content: ("`" + $sha + "` " + $title + " — by " + $author),
              allowed_mentions: {parse: []}}')

          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK_URL"
