name: Discord Merge Notification

# Called before and after deployment to create, then edit, one message.
on:
  workflow_call:
    inputs:
      message_id:
        type: string
        default: ''
      migrations_result:
        type: string
        default: pending
      migrated:
        type: boolean
        default: false
      deploy_result:
        type: string
        default: pending
      deployed:
        type: boolean
        default: false
      cloudflare_result:
        type: string
        default: pending
      cloudflare_deployed:
        type: boolean
        default: false
      dashboard_result:
        type: string
        default: pending
      dashboard_deployed:
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK_URL:
        required: true
    outputs:
      message_id:
        description: Discord message to update after deployment
        value: ${{ jobs.notify.outputs.message_id }}

permissions:
  contents: read

jobs:
  # Does not check out or run repository code, so the webhook secret stays safe.
  notify:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      message_id: ${{ steps.message.outputs.message_id }}
    steps:
      - name: Notify Discord
        id: message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MESSAGE_ID: ${{ inputs.message_id }}
          MIGRATIONS_RESULT: ${{ inputs.migrations_result }}
          MIGRATED: ${{ inputs.migrated }}
          DEPLOY_RESULT: ${{ inputs.deploy_result }}
          DEPLOYED: ${{ inputs.deployed }}
          CLOUDFLARE_RESULT: ${{ inputs.cloudflare_result }}
          CLOUDFLARE_DEPLOYED: ${{ inputs.cloudflare_deployed }}
          DASHBOARD_RESULT: ${{ inputs.dashboard_result }}
          DASHBOARD_DEPLOYED: ${{ inputs.dashboard_deployed }}
        run: |
          # First path segment of each changed file, e.g. "dashboard / wiki".
          # Falls back so an API failure does not drop the whole message.
          scope=$(gh api "repos/$REPO/commits/$COMMIT_SHA" \
            --jq '[.files[].filename | split("/")[0]] | unique | join(" / ")') \
            || scope="unknown"

          # allowed_mentions blocks pings such as @everyone in commit messages.
          payload=$(jq -n \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg message "${COMMIT_MESSAGE%%$'\n'*}" \
            --arg scope "$scope" \
            --arg author "$COMMIT_AUTHOR" \
            --arg conclusion "$CI_CONCLUSION" \
            --arg migrations_result "$MIGRATIONS_RESULT" \
            --arg migrated "$MIGRATED" \
            --arg deploy_result "$DEPLOY_RESULT" \
            --arg deployed "$DEPLOYED" \
            --arg cloudflare_result "$CLOUDFLARE_RESULT" \
            --arg cloudflare_deployed "$CLOUDFLARE_DEPLOYED" \
            --arg dashboard_result "$DASHBOARD_RESULT" \
            --arg dashboard_deployed "$DASHBOARD_DEPLOYED" \
            'def status($result; $deployed):
              if $conclusion != "success" then "⏭️ Not run (CI did not pass)"
              elif $result == "pending" then "⏳ Pending"
              elif $result == "failure" then "❌ Failed"
              elif $result == "cancelled" then "🚫 Cancelled"
              elif $result == "success" and $deployed == "true" then "✅ Succeeded"
              else "⏭️ Skipped" end;
            {content: ("### " + $sha + ": " + $message +
              "\nScope: " + $scope +
              "\nBy: " + $author +
              "\nCI: " + (if $conclusion == "success" then "✅ Passed" else "❌ " + $conclusion end) +
              "\nSupabase migrations: " + status($migrations_result; $migrated) +
              "\nFly deploy: " + status($deploy_result; $deployed) +
              "\nCloudflare deploy: " + status($cloudflare_result; $cloudflare_deployed) +
              "\nDashboard deploy: " + status($dashboard_result; $dashboard_deployed)),
              allowed_mentions: {parse: []}}')

          if [ -n "$MESSAGE_ID" ]; then
            curl --fail-with-body -sS -X PATCH \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$WEBHOOK_URL/messages/$MESSAGE_ID" > /dev/null
          else
            response=$(curl --fail-with-body -sS \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$WEBHOOK_URL?wait=true")
            message_id=$(jq -er '.id | strings | select(test("^[0-9]+$"))' <<< "$response")
            echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
          fi
