name: Cloudflare Deploy

# Deploys both static sites after CI passes on main. Pull requests never deploy.
# Requires the CLOUDFLARE_API_TOKEN repository secret and CLOUDFLARE_ACCOUNT_ID variable.
# Disconnect Cloudflare Git builds before merging to avoid duplicate production deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      # workflow_run's GITHUB_SHA can differ from the commit CI tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Build sites
        run: |
          for site in web wiki; do
            (
              cd "$site"
              bun install --frozen-lockfile
              bun run build
            )
          done
      # CI can finish out of order or be re-run. Never replace a newer deployment.
      - name: Read the tip of main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
      - name: Deploy sites
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          bunx wrangler@4.162.0 deploy --cwd web
          bunx wrangler@4.162.0 deploy --cwd wiki
