name: Deploy

# Deploys main to Fly after CI and Supabase migrations pass on a push, and the
# web and wiki sites to Cloudflare Workers after CI passes. Pull requests never deploy.
# Needs the Fly app "keysy" and the repository secret FLY_API_TOKEN, an app-scoped
# deploy token: fly tokens create deploy -a keysy
# Cloudflare needs the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable.
# Disconnect Cloudflare Git builds to avoid duplicate production deploys.
# Dashboard and site checks also need CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET,
# authorized by Cloudflare Access Service Auth policies for dashboard.keysy.net,
# keysy.net and wiki.keysy.net.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.event == 'push'
    uses: ./.github/workflows/discord-merge.yml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  migrations:
    name: Supabase migrations
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
    steps:
      # Schema first, then code. Check the commit CI tested, not workflow_run's GITHUB_SHA.
      # Wait outside the deployment lock so an older migration check cannot block a newer deploy.
      - name: Wait for Supabase migrations
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for _ in $(seq 60); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/check-runs?check_name=Supabase%20Preview" \
              --jq '.check_runs[0] | if . == null then "pending" else (.conclusion // "pending") end')
            case "$conclusion" in
              success) exit 0 ;;
              pending) sleep 15 ;;
              *) echo "::error::Supabase migrations finished with: $conclusion"; exit 1 ;;
            esac
          done
          echo "::error::Supabase migrations did not finish within 15 minutes"
          exit 1

  deploy:
    name: Deploy
    needs: [notify, migrations]
    # A notification failure must not block deployment.
    if: ${{ !cancelled() && needs.migrations.result == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.assets.outcome == 'success' }}
    # Serialize only deploys, so CI notifications do not wait for an older deploy.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      # Deploy the commit CI tested, not whatever main points to now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      # CI runs can finish out of order or be re-run. Only the tip of main deploys,
      # so an older commit never replaces a newer one.
      - name: Read the tip of main
        id: main
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        # fly.toml has no machine count. Without this flag, a deploy to zero machines creates two.
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # flyctl only waits for supervisord to start, so a service that fails still looks deployed.
      - name: Check the public hosts
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        run: |
          for url in https://api.keysy.net/health https://auth.keysy.net/health; do
            curl --fail --silent --show-error --location --max-redirs 0 --output /dev/null --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors "$url"
          done
      # A stale page can return 200 while its CSS or JS is gone from the origin.
      # The unique query string skips the Cloudflare cache, so the origin answers.
      - name: Check the dashboard assets
        id: assets
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          : "${CF_ACCESS_CLIENT_ID:?Set the CF_ACCESS_CLIENT_ID repository secret}"
          : "${CF_ACCESS_CLIENT_SECRET:?Set the CF_ACCESS_CLIENT_SECRET repository secret}"
          origin=https://dashboard.keysy.net
          # Never follow redirects with credentials, including Access login redirects.
          dashboard_get() {
            curl --fail --silent --show-error --location --max-redirs 0 --max-time 10 --retry 3 --retry-delay 5 --retry-all-errors \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$@"
          }
          # The root normally redirects. Check the sign-in page directly instead.
          html=$(dashboard_get "$origin/signin")
          assets=$(printf '%s' "$html" | grep --only-matching --extended-regexp '/_next/static/[^"\\]*\.(css|js)' | sort --unique)
          test -n "$assets"
          for path in $assets; do
            dashboard_get --output /dev/null "$origin$path?deploy=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          done

  cloudflare:
    name: Cloudflare
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.sites.outcome == 'success' }}
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      # workflow_run's GITHUB_SHA can differ from the commit CI tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Build sites
        run: |
          for site in web wiki; do
            (
              cd "$site"
              bun install --frozen-lockfile
              bun run build
            )
          done
      # CI can finish out of order or be re-run. Never replace a newer deployment.
      - name: Read the tip of main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
      - name: Deploy sites
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          bunx wrangler@latest deploy --cwd web
          bunx wrangler@latest deploy --cwd wiki
      # Both sites are behind Cloudflare Access. Never follow redirects, including Access login redirects.
      - name: Check the sites
        id: sites
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          : "${CF_ACCESS_CLIENT_ID:?Set the CF_ACCESS_CLIENT_ID repository secret}"
          : "${CF_ACCESS_CLIENT_SECRET:?Set the CF_ACCESS_CLIENT_SECRET repository secret}"
          for url in https://keysy.net/ https://wiki.keysy.net/; do
            curl --fail --silent --show-error --location --max-redirs 0 --output /dev/null --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$url"
          done

  update-notification:
    needs: [notify, migrations, deploy, cloudflare]
    if: always() && needs.notify.outputs.message_id != '' && github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/discord-merge.yml
    with:
      message_id: ${{ needs.notify.outputs.message_id }}
      deploy_result: ${{ needs.migrations.result != 'success' && needs.migrations.result || needs.deploy.result }}
      deployed: ${{ needs.deploy.outputs.deployed == 'true' }}
      cloudflare_result: ${{ needs.cloudflare.result }}
      cloudflare_deployed: ${{ needs.cloudflare.outputs.deployed == 'true' }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
