name: Deploy

# Deploys main to Fly after CI and Supabase migrations pass on a push, and the
# web and wiki sites to Cloudflare Workers after CI passes. The dashboard deploys
# to Cloudflare Workers after Fly is healthy. Audit Postgres migrations apply after
# CI passes. Pull requests never deploy.
# Needs the Fly app "keysy" and the repository secret FLY_API_TOKEN, an app-scoped
# deploy token: fly tokens create deploy -a keysy
# Cloudflare needs the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable.
# Disconnect Cloudflare Git builds to avoid duplicate production deploys.
# Supabase needs SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets,
# plus the SUPABASE_PROJECT_ID variable. Disable its native Deploy to production option.
# Audit migrations need the AUDIT_DATABASE_URL repository secret (audit Postgres URI
# without sslmode or sslrootcert; the job verifies TLS with deploy/aiven-ca.pem).
# Vercel needs the VERCEL_TOKEN repository secret and the VERCEL_ORG_ID and
# VERCEL_PROJECT_ID repository variables. The Vercel project Root Directory is bot.
# Disconnect Vercel Git builds to avoid duplicate production deploys.
# Dashboard and site checks also need CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET,
# authorized by Cloudflare Access Service Auth policies for dashboard.keysy.net,
# keysy.net and wiki.keysy.net.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.event == 'push'
    uses: ./.github/workflows/discord-merge.yml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  migrations:
    name: Supabase migrations
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      migrated: ${{ steps.migrate.outcome == 'success' }}
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    steps:
      # Schema first, then code. Check the commit CI tested, not workflow_run's GITHUB_SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # An older CI run must not apply migrations after a newer main commit.
      - name: Read the tip of main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        with:
          version: 3.1.0
      - name: Apply Supabase migrations
        id: migrate
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Set the SUPABASE_ACCESS_TOKEN repository secret}"
          : "${SUPABASE_DB_PASSWORD:?Set the SUPABASE_DB_PASSWORD repository secret}"
          : "${SUPABASE_PROJECT_ID:?Set the SUPABASE_PROJECT_ID repository variable}"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --remote --dry-run --skip-vault
          supabase db push --remote --yes --skip-vault

  audit-migrations:
    name: Audit migrations
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      migrated: ${{ steps.migrate.outcome == 'success' }}
    concurrency:
      group: audit-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # An older CI run must not apply migrations after a newer main commit.
      - name: Read the tip of main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        with:
          go-version-file: audit/go.mod
          cache: false
      - name: Apply audit migrations
        id: migrate
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ secrets.AUDIT_DATABASE_URL }}
          GOOSE_MIGRATION_DIR: audit/migrations
          PGSSLMODE: verify-full
          PGSSLROOTCERT: deploy/aiven-ca.pem
        run: |
          : "${GOOSE_DBSTRING:?Set the AUDIT_DATABASE_URL repository secret}"
          go run github.com/pressly/goose/v3/cmd/goose@v3.30.2 up

  deploy:
    name: Deploy
    needs: [notify, migrations]
    # A notification failure must not block deployment.
    if: ${{ !cancelled() && needs.migrations.result == 'success' && needs.migrations.outputs.migrated == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.hosts.outcome == 'success' }}
    # Serialize only deploys, so CI notifications do not wait for an older deploy.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      # Deploy the commit CI tested, not whatever main points to now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      # CI runs can finish out of order or be re-run. Only the tip of main deploys,
      # so an older commit never replaces a newer one.
      - name: Read the tip of main
        id: main
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        # fly.toml has no machine count. Without this flag, a deploy to zero machines creates two.
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # flyctl only waits for s6-svscan to start, so a service that fails still looks deployed.
      - name: Check the public hosts
        id: hosts
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        run: |
          for url in https://api.keysy.net/health https://auth.keysy.net/health; do
            curl --fail --silent --show-error --location --max-redirs 0 --output /dev/null --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors "$url"
          done

  cloudflare:
    name: Cloudflare
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.sites.outcome == 'success' }}
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      # workflow_run's GITHUB_SHA can differ from the commit CI tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Build sites
        run: |
          for site in web wiki; do
            (
              cd "$site"
              bun install --frozen-lockfile
              bun run build
            )
          done
      # CI can finish out of order or be re-run. Never replace a newer deployment.
      - name: Read the tip of main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
      - name: Deploy sites
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          bunx wrangler@latest deploy --cwd web
          bunx wrangler@latest deploy --cwd wiki
      # Both sites are behind Cloudflare Access. Never follow redirects, including Access login redirects.
      - name: Check the sites
        id: sites
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          : "${CF_ACCESS_CLIENT_ID:?Set the CF_ACCESS_CLIENT_ID repository secret}"
          : "${CF_ACCESS_CLIENT_SECRET:?Set the CF_ACCESS_CLIENT_SECRET repository secret}"
          for url in https://keysy.net/ https://wiki.keysy.net/; do
            curl --fail --silent --show-error --location --max-redirs 0 --output /dev/null --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$url"
          done

  dashboard:
    name: Dashboard
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.assets.outcome == 'success' }}
    concurrency:
      group: dashboard-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Build dashboard
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Read the tip of main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
      - name: Deploy dashboard
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          bunx wrangler@latest deploy --cwd dashboard
      # A stale page can return 200 while its CSS or JS is gone from the origin.
      # The unique query string skips the Cloudflare cache, so the origin answers.
      - name: Check the dashboard assets
        id: assets
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          : "${CF_ACCESS_CLIENT_ID:?Set the CF_ACCESS_CLIENT_ID repository secret}"
          : "${CF_ACCESS_CLIENT_SECRET:?Set the CF_ACCESS_CLIENT_SECRET repository secret}"
          origin=https://dashboard.keysy.net
          # Never follow redirects with credentials, including Access login redirects.
          dashboard_get() {
            curl --fail --silent --show-error --location --max-redirs 0 --max-time 10 --retry 3 --retry-delay 5 --retry-all-errors \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$@"
          }
          # Check the sign-in route and its referenced assets.
          html=$(dashboard_get "$origin/signin")
          assets=$(printf '%s' "$html" | grep --only-matching --extended-regexp '/assets/[^"\\]*\.(css|js)' | sort --unique)
          printf '%s\n' "$assets" | grep -qE '\.js$'
          printf '%s\n' "$assets" | grep -qE '\.css$'
          # The SPA fallback answers a missing asset with 200 text/html, so also check the type.
          for path in $assets; do
            type=$(dashboard_get --output /dev/null --write-out '%{content_type}' "$origin$path?deploy=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT")
            case "$path:$type" in
              *.css:text/css*|*.js:text/javascript*|*.js:application/javascript*) ;;
              *) echo "$path returned ${type:-no content type}" >&2; exit 1 ;;
            esac
          done

  vercel:
    name: Vercel
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed == 'true' }}
    concurrency:
      group: vercel-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Read the tip of main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
      # Vercel builds the bot from the uploaded source. The project Root Directory selects bot/.
      - name: Deploy bot
        id: deploy
        if: steps.main.outputs.sha == github.event.workflow_run.head_sha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN repository secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID repository variable}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_PROJECT_ID repository variable}"
          vercel=(bunx vercel@64.0.2)
          deployment_url=$("${vercel[@]}" deploy --prod --skip-domain --yes --non-interactive |
            jq -er '.deployment.url | select(type == "string" and test("^https://[A-Za-z0-9-]+[.]vercel[.]app$"))')
          echo "Staged $deployment_url"

          "${vercel[@]}" curl "$deployment_url/eve/v1/health" --fail --silent --show-error --max-time 15 |
            jq -e '.ok == true and .status == "ready"'

          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$tip" != "$HEAD_SHA" ]]; then
            echo "Skipping promotion because main advanced to $tip."
            exit 0
          fi

          "${vercel[@]}" promote "$deployment_url" --yes --non-interactive
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  update-notification:
    needs: [notify, migrations, audit-migrations, deploy, cloudflare, dashboard, vercel]
    if: always() && needs.notify.outputs.message_id != '' && github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/discord-merge.yml
    with:
      message_id: ${{ needs.notify.outputs.message_id }}
      migrations_result: ${{ needs.migrations.result }}
      migrated: ${{ needs.migrations.outputs.migrated == 'true' }}
      audit_migrations_result: ${{ needs.audit-migrations.result }}
      audit_migrated: ${{ needs.audit-migrations.outputs.migrated == 'true' }}
      deploy_result: ${{ needs.deploy.result }}
      deployed: ${{ needs.deploy.outputs.deployed == 'true' }}
      cloudflare_result: ${{ needs.cloudflare.result }}
      cloudflare_deployed: ${{ needs.cloudflare.outputs.deployed == 'true' }}
      dashboard_result: ${{ needs.dashboard.result }}
      dashboard_deployed: ${{ needs.dashboard.outputs.deployed == 'true' }}
      vercel_result: ${{ needs.vercel.result }}
      vercel_deployed: ${{ needs.vercel.outputs.deployed == 'true' }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
