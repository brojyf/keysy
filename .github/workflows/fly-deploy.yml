name: Fly Deploy

# Deploys main to Fly after CI passes on a push, when the push changed the image.
# Pull requests never deploy.
# Needs the Fly app "keysy" and the repository secret FLY_API_TOKEN, an app-scoped
# deploy token: fly tokens create deploy -a keysy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a running deploy. A newer run waits its turn.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # Pushes are squash merges, so one commit holds every changed file.
  # If the API call fails, this job fails and nothing deploys.
  changes:
    name: Changes
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Paths that end up in the image: see deploy/Dockerfile and .dockerignore.
          # The dashboard imports only design/tokens/tokens.css (dashboard/src/app/globals.css).
          image='^(api|auth|dashboard|otel|deploy)/|^design/tokens/tokens\.css$|^(fly\.toml|\.dockerignore|\.github/workflows/fly-deploy\.yml)$'
          files=$(gh api --paginate "repos/$REPO/commits/$COMMIT_SHA" --jq '.files[].filename')
          if grep -Eq "$image" <<< "$files"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "No deployable path changed. Skipping deploy."
          fi

  deploy:
    name: Deploy
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Deploy the commit CI tested, not whatever main points to now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
