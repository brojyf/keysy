# Routes by host name to the processes in this machine. Runs as a non-root user.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    # Off on purpose: auth callback URLs carry short-lived authorization codes.
    access_log off;

    # Every temp path must be writable without root, including unused ones.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Fly health checks and unknown hosts land here.
    server {
        listen 8000 default_server;
        location = /health/api { proxy_pass http://127.0.0.1:8081/health; }
        location = /health/auth { proxy_pass http://127.0.0.1:8080/health; }
        location / { return 404; }
    }

    server {
        listen 8000;
        server_name api.keysy.net;
        location / { proxy_pass http://127.0.0.1:8081; }
    }

    server {
        listen 8000;
        server_name auth.keysy.net;
        location / { proxy_pass http://127.0.0.1:8080; }
    }

    server {
        listen 8000;
        server_name dashboard.keysy.net;
        location / { proxy_pass http://127.0.0.1:5173; }
    }
}
