; PID 1 of the Fly machine. It must stay in the foreground, or Fly stops the machine.
; Child logs go to stdout and stderr, which Fly collects.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:otelcol]
command=/usr/local/bin/otelcol --config=/etc/otelcol/config.yaml
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/usr/local/bin/keysy-api
environment=PORT="8081"
priority=20
autorestart=true
; The api exits at startup when the database is down, and autorestart skips that exit.
; Each try waits one second longer than the last. This limit keeps it trying for good.
startretries=100000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auth]
command=/usr/local/bin/keysy-auth
environment=PORT="8080"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
; Next keeps runtime page copies in route-cache without a build ID, and they can outlive a deploy.
; Old pages then point to deleted assets. Remove this after https://github.com/vercel/next.js/issues/99680 is fixed.
command=/bin/sh -c "rm -rf .next/server/route-cache && exec /app/dashboard/node_modules/.bin/next start --hostname 127.0.0.1 --port 5173"
directory=/app/dashboard
; V8's default heap limit is larger than the 256 MB machine.
environment=NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=96"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
