root = "."
tmp_dir = "tmp"
env_files = [".env.local"]

[build]
cmd = "go build -o ./tmp/keysy-auth ."
entrypoint = ["./tmp/keysy-auth"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum", ".env.local"]
exclude_dir = ["tmp", "vendor", "testdata"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[misc]
clean_on_exit = true
